                    disabled={isSyncing}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/40 rounded-xl text-xs font-bold flex items-center gap-1.5 transition active:scale-95 disabled:opacity-50"
                    title="Buscar novos cadastros da nuvem agora"
                  >
                    <Icon name="refresh" className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`} />
                    <span className="hidden sm:inline">{isSyncing ? 'Sincronizando...' : 'Sincronizar Nuvem'}</span>
                  </button>
                )}

                {lastSyncTime && (
                  <span className="hidden lg:inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 text-[11px] font-mono border border-emerald-500/20">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Sync: {lastSyncTime}</span>
                  </span>
                )}

                <button onClick={onLogout} title="Sair" className="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white transition">
                  <Icon name="logOut" className="w-5 h-5" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 flex-1 w-full">
            {/* Top Stat Cards */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div className="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                  <Icon name="users" className="w-6 h-6" />
                </div>
                <div>
                  <div className="text-2xl font-black text-slate-900">{nonAdminUsers.length}</div>
                  <div className="text-xs font-bold text-slate-500 uppercase">Cadastros Totais</div>
                  <div className="text-[10px] text-slate-400 mt-0.5">{freelancers.length} Freelancers • {companies.length} Empresas</div>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div className="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                  <Icon name="clock" className="w-6 h-6" />
                </div>
                <div>
                  <div className="text-2xl font-black text-slate-900">{pendingUsers.length}</div>
                  <div className="text-xs font-bold text-slate-500 uppercase">Pendentes</div>
                  <div className="text-[10px] text-slate-400 mt-0.5">{pendingUsers.length === 0 ? 'Tudo em dia' : 'Aguardando ação'}</div>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div className="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center">
                  <Icon name="briefcase" className="w-6 h-6" />
                </div>
                <div>
                  <div className="text-2xl font-black text-slate-900">{jobs.length}</div>
                  <div className="text-xs font-bold text-slate-500 uppercase">Vagas Publicadas</div>
                  <div className="text-[10px] text-slate-400 mt-0.5">Balneário Camboriú</div>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                  <Icon name="sparkles" className="w-6 h-6" />
                </div>
                <div>
                  <div className="text-2xl font-black text-emerald-600">100% Grátis</div>
                  <div className="text-xs font-bold text-slate-500 uppercase">Modo da Plataforma</div>
                  <div className="text-[10px] text-slate-400 mt-0.5">Tempo Ilimitado • Sem cobranças</div>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex border-b border-slate-200 mb-6 gap-2 overflow-x-auto scrollbar-none">
              <button
                type="button"
                onClick={() => setActiveTab('usuarios')}
                className={`pb-3 px-4 font-bold text-sm whitespace-nowrap transition flex items-center gap-2 ${
                  activeTab === 'usuarios' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="users" className="w-4 h-4" />
                <span>👥 Cadastros & Perfis ({nonAdminUsers.length})</span>
              </button>

              <button
                type="button"
                onClick={() => setActiveTab('pendentes')}
                className={`pb-3 px-4 font-bold text-sm whitespace-nowrap transition flex items-center gap-2 ${
                  activeTab === 'pendentes' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="clock" className="w-4 h-4" />
                <span>⏳ Pendentes ({pendingUsers.length})</span>
              </button>

              <button
                type="button"
                onClick={() => setActiveTab('vagas')}
                className={`pb-3 px-4 font-bold text-sm whitespace-nowrap transition flex items-center gap-2 ${
                  activeTab === 'vagas' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="briefcase" className="w-4 h-4" />
                <span>📢 Vagas no Sistema ({jobs.length})</span>
              </button>

              <button
                type="button"
                onClick={() => setActiveTab('gateways')}
                className={`pb-3 px-4 font-bold text-sm whitespace-nowrap flex items-center gap-2 transition ${
                  activeTab === 'gateways' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <span className={`w-2.5 h-2.5 rounded-full ${GATEWAY_INFO[gwForm.activeGateway]?.dotColor || 'bg-purple-500'} animate-pulse`}></span>
                <span>⚙️ Gateways PIX ({GATEWAY_INFO[gwForm.activeGateway]?.name || 'InfinitePay'})</span>
              </button>
            </div>

            {/* TAB 1: CADASTROS & PERFIS COMPLETOS (DEFAULT) */}
            {activeTab === 'usuarios' && (
              <div className="space-y-4">
                {/* Search & Filter Bar */}
                <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-2xs space-y-3">
                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <div className="relative flex-1">
                      <input
                        type="text"
                        value={userSearch}
                        onChange={e => setUserSearch(e.target.value)}
                        placeholder="Buscar por nome, email, telefone, CPF, CNPJ, profissão ou empresa..."
                        className="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-hidden transition"
                      />
                      <div className="absolute left-3 top-3 text-slate-400 pointer-events-none">
                        <Icon name="search" className="w-3.5 h-3.5" />
                      </div>
                      {userSearch && (
                        <button
                          type="button"
                          onClick={() => setUserSearch('')}
                          className="absolute right-3 top-3 text-slate-400 hover:text-slate-600"
                        >
                          <Icon name="x" className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>

                    {/* View mode toggle */}
                    <div className="flex items-center bg-slate-100 p-1 rounded-xl self-end sm:self-auto">
                      <button
                        type="button"
                        onClick={() => setViewMode('cards')}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                          viewMode === 'cards' ? 'bg-white text-indigo-600 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        <span>🗂️ Cards</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setViewMode('table')}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                          viewMode === 'table' ? 'bg-white text-indigo-600 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        <span>📋 Tabela</span>
                      </button>
                    </div>
                  </div>

                  {/* Filter Pills */}
                  <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
                    <div className="flex flex-wrap items-center gap-1.5">
                      <span className="text-[11px] font-bold text-slate-400 uppercase mr-1">Tipo:</span>
                      {[
                        { id: 'todos', label: `Todos (${nonAdminUsers.length})` },
                        { id: 'freelancer', label: `💼 Freelancers (${freelancers.length})` },
                        { id: 'empresa', label: `🏢 Empresas (${companies.length})` }
                      ].map(t => (
                        <button
                          key={t.id}
                          type="button"
                          onClick={() => setUserTypeFilter(t.id)}
                          className={`px-3 py-1 rounded-xl text-xs font-bold transition ${
                            userTypeFilter === t.id
                              ? 'bg-slate-900 text-white shadow-2xs'
                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {t.label}
                        </button>
                      ))}
                    </div>

                    <div className="flex flex-wrap items-center gap-1.5">
                      <span className="text-[11px] font-bold text-slate-400 uppercase mr-1">Status:</span>
                      {[
                        { id: 'todos', label: 'Todos' },
                        { id: 'aprovado', label: '🟢 Aprovados' },
                        { id: 'pendente', label: '🟡 Pendentes' },
                        { id: 'bloqueado', label: '🔴 Bloqueados' }
                      ].map(s => (
                        <button
                          key={s.id}
                          type="button"
                          onClick={() => setUserStatusFilter(s.id)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition ${
                            userStatusFilter === s.id
                              ? 'bg-indigo-600 text-white shadow-2xs'
                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {s.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Profiles Display (Cards or Table) */}
                {filteredUsers.length === 0 ? (
                  <div className="bg-white rounded-3xl border border-slate-200 p-12 text-center text-slate-500 space-y-3">
                    <div className="w-14 h-14 bg-indigo-50 text-indigo-500 rounded-2xl mx-auto flex items-center justify-center">
                      <Icon name="users" className="w-7 h-7" />
                    </div>
                    <div>
                      <p className="font-black text-base text-slate-800">Nenhum cadastro encontrado.</p>
                      <p className="text-xs text-slate-500 mt-1">
                        {userSearch || userTypeFilter !== 'todos' || userStatusFilter !== 'todos'
                          ? 'Tente remover os filtros de busca para ver todos os usuários.'
                          : 'Quando freelancers ou empresas se cadastrarem, os perfis aparecerão aqui em tempo real.'}
                      </p>
                    </div>
                    {onRefreshCloud && (
                      <button
                        type="button"
                        onClick={onRefreshCloud}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow-xs transition"
                      >
                        Sincronizar com a Nuvem
                      </button>
                    )}
                  </div>
                ) : viewMode === 'cards' ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    {filteredUsers.map(u => {
                      const isEmpresa = u.role === 'empresa';
                      const compJobs = isEmpresa ? jobs.filter(j => j.companyId === u.id || (j.companyName && j.companyName.toLowerCase() === u.name.toLowerCase())) : [];
                      const cleanPhone = (u.phone || '').replace(/\D/g, '');
                      const waUrl = cleanPhone ? `https://api.whatsapp.com/send?phone=55${cleanPhone}&text=${encodeURIComponent(`Olá ${u.name}! Sou da equipe do Freelancer BC.`)}` : null;
                      const docDisplay = u.cnpj ? `CNPJ: ${formatCNPJ(u.cnpj)}` : (u.cpf ? `CPF: ${formatCPF(u.cpf)}` : 'Doc não inf.');

                      return (
                        <div key={u.id} className="bg-white rounded-3xl border border-slate-200 p-5 shadow-xs hover:shadow-md transition flex flex-col justify-between space-y-4">
                          <div>
                            {/* Header row: Avatar + Badges */}
                            <div className="flex items-start justify-between gap-3 mb-3">
                              <div className="flex items-center gap-3">
                                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-black text-lg text-white shadow-xs ${
                                  isEmpresa ? 'bg-gradient-to-tr from-emerald-600 to-teal-500' : 'bg-gradient-to-tr from-indigo-600 to-purple-500'
                                }`}>
                                  {u.name ? u.name.substring(0, 2).toUpperCase() : (isEmpresa ? '🏢' : '👤')}
                                </div>
                                <div>
                                  <h4 className="font-black text-slate-900 text-base leading-tight">{u.name}</h4>
                                  <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                      isEmpresa ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-indigo-50 text-indigo-700 border border-indigo-200'
                                    }`}>
                                      {isEmpresa ? '🏢 Empresa' : '💼 Freelancer'}
                                    </span>
                                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                      u.status === 'aprovado' ? 'bg-emerald-100 text-emerald-800' :
                                      u.status === 'pendente' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'
                                    }`}>
                                      {u.status === 'aprovado' ? '🟢 Aprovado' : u.status === 'pendente' ? '🟡 Pendente' : '🔴 Bloqueado'}
                                    </span>
                                  </div>
                                </div>
                              </div>
                            </div>

                            {/* Details Box */}
                            <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-1.5 text-xs">
                              <div className="flex items-center justify-between text-slate-600">
                                <span className="font-semibold text-slate-400">Documento:</span>
                                <strong className="text-slate-800 font-mono">{docDisplay}</strong>
                              </div>

                              <div className="flex items-center justify-between text-slate-600">
                                <span className="font-semibold text-slate-400">E-mail:</span>
                                <span className="text-slate-800 truncate max-w-[180px]" title={u.email}>{u.email}</span>
                              </div>

                              <div className="flex items-center justify-between text-slate-600">
                                <span className="font-semibold text-slate-400">Senha:</span>
                                <span className="font-mono font-bold text-indigo-700 bg-indigo-50 border border-indigo-100 px-2 py-0.5 rounded text-[11px]">{u.password || '—'}</span>
                              </div>

                              <div className="flex items-center justify-between text-slate-600">
                                <span className="font-semibold text-slate-400">WhatsApp:</span>
                                <div className="flex items-center gap-1.5">
                                  <span className="text-slate-800 font-mono">{formatPhone(u.phone)}</span>
                                  {waUrl && (
                                    <a
                                      href={waUrl}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      className="text-[10px] font-bold text-emerald-700 hover:text-emerald-800 bg-emerald-100 hover:bg-emerald-200 px-1.5 py-0.5 rounded-md transition"
                                      title="Chamar no WhatsApp"
                                    >
                                      Abrir Whats
                                    </a>
                                  )}
                                </div>
                              </div>

                              <div className="flex items-center justify-between text-slate-600">
                                <span className="font-semibold text-slate-400">{isEmpresa ? 'Ramo:' : 'Especialidade:'}</span>
                                <span className="font-bold text-indigo-700">{isEmpresa ? (u.businessType || 'Bar / Balada') : (u.profession || 'Garçom')}</span>
                              </div>

                              {isEmpresa && (
                                <div className="flex items-center justify-between text-slate-600 pt-1 border-t border-slate-200/60">
                                  <span className="font-semibold text-slate-400">Vagas Publicadas:</span>
                                  <span className="font-bold text-slate-800 bg-white px-2 py-0.5 rounded-md border border-slate-200">{compJobs.length} vagas</span>
                                </div>
                              )}

                              <div className="flex items-center justify-between text-slate-600 pt-1 border-t border-slate-200/60">
                                <span className="font-semibold text-slate-400">Validade:</span>
                                <span className="font-bold text-emerald-700">
                                  Acesso Gratuito Ilimitado
                                </span>
                              </div>
                            </div>
                          </div>

                          {/* Card Actions */}
                          <div className="pt-2 border-t border-slate-100 flex items-center gap-2">
                            <button
                              type="button"
                              onClick={() => setSelectedUserForModal(u)}
                              className="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-2xs"
                            >
                              <Icon name="eye" className="w-3.5 h-3.5" />
                              <span>Ver Perfil</span>
                            </button>

                            {onToggleStatus && (
                              <button
                                type="button"
                                onClick={() => onToggleStatus(u.id)}
                                className={`p-2.5 rounded-xl text-xs font-bold border transition ${
                                  u.status === 'bloqueado'
                                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border-slate-200'
                                }`}
                                title={u.status === 'bloqueado' ? 'Desbloquear acesso' : 'Bloquear acesso'}
                              >
                                <Icon name={u.status === 'bloqueado' ? 'play' : 'pause'} className="w-3.5 h-3.5" />
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-2xs">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 text-slate-400 text-xs uppercase">
                        <tr>
                          <th className="p-4">Usuário</th>
                          <th className="p-4">Tipo</th>
                          <th className="p-4">Documento</th>
                          <th className="p-4">WhatsApp</th>
                          <th className="p-4">Status</th>
                          <th className="p-4">Validade</th>
                          <th className="p-4 text-right">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredUsers.map(u => {
                          const isEmpresa = u.role === 'empresa';
                          const cleanPhone = (u.phone || '').replace(/\D/g, '');
                          const waUrl = cleanPhone ? `https://api.whatsapp.com/send?phone=55${cleanPhone}&text=${encodeURIComponent(`Olá ${u.name}! Sou da equipe do Freelancer BC.`)}` : null;

                          return (
                            <tr key={u.id} className="hover:bg-slate-50">
                              <td className="p-4 font-bold text-slate-900">
                                {u.name}
                                <span className="block text-xs font-normal text-slate-400">{u.email}</span>
                                <span className="block text-[11px] font-mono text-indigo-600 font-bold mt-0.5">Senha: {u.password || '—'}</span>
                              </td>
                              <td className="p-4">
                                <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${
                                  isEmpresa ? 'bg-emerald-50 text-emerald-700' : 'bg-indigo-50 text-indigo-700'
                                }`}>
                                  {isEmpresa ? '🏢 Empresa' : '💼 Freelancer'}
                                </span>
                              </td>
                              <td className="p-4 font-mono text-xs">
                                {u.cnpj ? formatCNPJ(u.cnpj) : (u.cpf ? formatCPF(u.cpf) : '-')}
                              </td>
                              <td className="p-4 font-mono text-xs">
                                <div className="flex items-center gap-1.5">
                                  <span>{formatPhone(u.phone)}</span>
                                  {waUrl && (
                                    <a href={waUrl} target="_blank" rel="noopener noreferrer" className="text-[10px] text-emerald-600 hover:underline font-bold">
                                      Whats
                                    </a>
                                  )}
                                </div>
                              </td>
                              <td className="p-4">
                                <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${
                                  u.status === 'aprovado' ? 'bg-emerald-50 text-emerald-700' :
                                  u.status === 'pendente' ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-700'
                                }`}>
                                  {u.status}
                                </span>
                              </td>
                              <td className="p-4 text-xs font-semibold text-emerald-700">
                                Acesso Gratuito Ilimitado
                              </td>
                              <td className="p-4 text-right space-x-1.5">
                                <button
                                  type="button"
                                  onClick={() => setSelectedUserForModal(u)}
                                  className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold"
                                >
                                  Ver Perfil
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: PENDENTES */}
            {activeTab === 'pendentes' && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                {pendingUsers.length === 0 ? (
                  <div className="p-12 text-center text-slate-400 space-y-2">
                    <Icon name="checkCircle" className="w-10 h-10 mx-auto text-emerald-500" />
                    <p className="font-bold text-slate-700">Nenhum cadastro pendente de aprovação.</p>
                    <p className="text-xs text-slate-400">Todos os novos cadastros são liberados automaticamente com 30 dias de acesso gratuito.</p>
                  </div>
                ) : (
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50 text-slate-400 text-xs uppercase">
                      <tr>
                        <th className="p-4">Usuário</th>
                        <th className="p-4">Tipo</th>
                        <th className="p-4">Documento</th>
                        <th className="p-4">WhatsApp</th>
                        <th className="p-4 text-right">Ação</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {pendingUsers.map(u => (
                        <tr key={u.id}>
                          <td className="p-4 font-bold text-slate-900">
                            {u.name}
                            <span className="block text-xs font-normal text-slate-400">{u.email}</span>
                          </td>
                          <td className="p-4 capitalize">{u.role}</td>
                          <td className="p-4 font-mono text-xs">{u.cnpj ? formatCNPJ(u.cnpj) : (u.cpf ? formatCPF(u.cpf) : '-')}</td>
                          <td className="p-4 font-mono text-xs">{formatPhone(u.phone)}</td>
                          <td className="p-4 text-right space-x-2">
                            <button
                              type="button"
                              onClick={() => setSelectedUserForModal(u)}
                              className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg text-xs font-bold"
                            >
                              Ver Perfil
                            </button>
                            <button
                              type="button"
                              onClick={() => onApprove(u.id)}
                              className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold"
                            >
                              Aprovar (+30d)
                            </button>
                            <button
                              type="button"
                              onClick={() => onReject(u.id)}
                              className="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-bold"
                            >
                              Rejeitar
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}

            {/* TAB 3: TODAS AS VAGAS */}
            {activeTab === 'vagas' && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="p-5 border-b border-slate-100 flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-slate-900">Vagas Publicadas na Plataforma</h3>
                    <p className="text-xs text-slate-500">Todas as oportunidades cadastradas por estabelecimentos</p>
                  </div>
                  <span className="text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-200 px-3 py-1 rounded-full">
                    {jobs.length} vagas totais
                  </span>
                </div>

                {jobs.length === 0 ? (
                  <div className="p-12 text-center text-slate-400">Nenhuma vaga publicada no momento.</div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 text-slate-400 text-xs uppercase">
                        <tr>
                          <th className="p-4">Vaga / Cargo</th>
                          <th className="p-4">Empresa</th>
                          <th className="p-4">Data & Horário</th>
                          <th className="p-4">Remuneração</th>
                          <th className="p-4">Status</th>
                          <th className="p-4">Vagas Preenchidas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {jobs.map(job => (
                          <tr key={job.id} className="hover:bg-slate-50">
                            <td className="p-4 font-bold text-slate-900">{job.title}<span className="block text-xs font-normal text-slate-400">{job.category}</span></td>
                            <td className="p-4 font-semibold text-slate-800">{job.companyName}</td>
                            <td className="p-4 text-xs font-medium">{job.date} • {job.startTime} às {job.endTime}</td>
                            <td className="p-4 font-bold text-emerald-600">{formatRemuneration(job).display}</td>
                            <td className="p-4">
                              <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${
                                job.status === 'ativa' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'
                              }`}>
                                {job.status || 'ativa'}
                              </span>
                            </td>
                            <td className="p-4 text-xs font-semibold">{job.filledSpots || 0} de {job.totalSpots || 1}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* TAB FINANCEIRO: HISTÓRICO DE RECONHECIMENTOS */}
            {activeTab === 'financeiro' && (
              <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div className="p-5 border-b border-slate-100 flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-slate-900">Histórico de Transações e Webhooks</h3>
                    <p className="text-xs text-slate-500">Todas as cobranças geradas e reconhecidas pelo Banco Central</p>
                  </div>
                  <span className="text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full">
                    {invoices.filter(i => i.status === 'pago').length} liquidadas
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50 text-slate-400 text-xs uppercase">
                      <tr>
                        <th className="p-4">Identificador</th>
                        <th className="p-4">Cliente</th>
                        <th className="p-4">Valor</th>
                        <th className="p-4">Status Banco</th>
                        <th className="p-4">Protocolo BACEN</th>
                        <th className="p-4">Data/Hora</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {invoices.map(inv => (
                        <tr key={inv.id} className="hover:bg-slate-50">
                          <td className="p-4 font-mono font-bold text-xs">{inv.id}</td>
                          <td className="p-4 text-xs font-semibold">{inv.userName}</td>
                          <td className="p-4 font-black text-slate-900">{formatMoney(inv.amount)}</td>
                          <td className="p-4">
                            <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full text-[11px] font-bold">
                              {inv.status === 'pago' ? 'RECONHECIDO' : 'PENDENTE'}
                            </span>
                          </td>
                          <td className="p-4 font-mono text-xs text-slate-500">{inv.bankProtocol || 'Aguardando'}</td>
                          <td className="p-4 text-xs text-slate-500">{new Date(inv.paidAt || inv.createdAt).toLocaleString('pt-BR')}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB GATEWAYS: SELETOR E CONFIGURAÇÃO (INFINITEPAY / PAGBANK / MERCADO PAGO) */}
            {activeTab === 'gateways' && (() => {
              const currentGw = GATEWAY_INFO[gwForm.activeGateway] || GATEWAY_INFO.infinitepay;

              return (
                <div className="space-y-6 animate-in fade-in duration-200">
                  {/* SELETOR DE GATEWAY ATIVO */}
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <div>
                        <h2 className="text-lg font-black text-slate-900">Escolha o seu Gateway de Pagamento PIX</h2>
                        <p className="text-xs text-slate-500">Selecione por onde você deseja receber o dinheiro das assinaturas dos seus clientes.</p>
                      </div>
                      <span className="text-xs font-bold px-3 py-1 rounded-full bg-slate-900 text-white">
                        Ativo no momento: {currentGw.name}
                      </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {/* CARD 1: INFINITEPAY */}
                      <div
                        onClick={() => setGwForm(prev => ({ ...prev, activeGateway: 'infinitepay' }))}
                        className={`cursor-pointer rounded-2xl p-5 border-2 transition relative ${
                          gwForm.activeGateway === 'infinitepay'
                            ? 'border-purple-600 bg-purple-50/50 shadow-md ring-2 ring-purple-500/20'
                            : 'border-slate-200 bg-white hover:border-slate-300'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-3">
                          <div className="w-10 h-10 rounded-xl bg-purple-600 text-white font-black text-base flex items-center justify-center shadow-md shadow-purple-600/30">
                            8
                          </div>
                          <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-purple-100 text-purple-800">
                            ⭐ Taxa 0% no PIX
                          </span>
                        </div>
                        <h3 className="font-bold text-slate-900 text-base">InfinitePay (CloudWalk)</h3>
                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                          Receba via PIX com <strong>taxa zero</strong> na conta PJ/MEI. Dinheiro cai no mesmo segundo e o saldo rende automaticamente.
                        </p>
                        <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold">
                          <span className="text-purple-700">CloudWalk Meios de Pagamento</span>
                          {gwForm.activeGateway === 'infinitepay' && <span className="text-purple-600 font-bold">✓ Selecionado</span>}
                        </div>
                      </div>

                      {/* CARD 2: PAGBANK */}
                      <div
                        onClick={() => setGwForm(prev => ({ ...prev, activeGateway: 'pagbank' }))}
                        className={`cursor-pointer rounded-2xl p-5 border-2 transition relative ${
                          gwForm.activeGateway === 'pagbank'
                            ? 'border-emerald-600 bg-emerald-50/50 shadow-md ring-2 ring-emerald-500/20'
                            : 'border-slate-200 bg-white hover:border-slate-300'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-3">
                          <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white font-black text-base flex items-center justify-center shadow-md shadow-emerald-600/30">
                            P
                          </div>
                          <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-emerald-100 text-emerald-800">
                            Fácil CPF ou CNPJ
                          </span>
                        </div>
                        <h3 className="font-bold text-slate-900 text-base">PagBank (PagSeguro)</h3>
                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                          Muito simples para abrir como <strong>Pessoa Física (CPF)</strong> ou Jurídica. Banco digital tradicional (Banco 290) com API PIX estável.
                        </p>
                        <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold">
                          <span className="text-emerald-700">Banco PagBank S.A. (290)</span>
                          {gwForm.activeGateway === 'pagbank' && <span className="text-emerald-600 font-bold">✓ Selecionado</span>}
                        </div>
                      </div>

                      {/* CARD 3: MERCADO PAGO */}
                      <div
                        onClick={() => setGwForm(prev => ({ ...prev, activeGateway: 'mercadopago' }))}
                        className={`cursor-pointer rounded-2xl p-5 border-2 transition relative ${
                          gwForm.activeGateway === 'mercadopago'
                            ? 'border-sky-600 bg-sky-50/50 shadow-md ring-2 ring-sky-500/20'
                            : 'border-slate-200 bg-white hover:border-slate-300'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-3">
                          <div className="w-10 h-10 rounded-xl bg-sky-500 text-white font-black text-base flex items-center justify-center shadow-md shadow-sky-500/30">
                            MP
                          </div>
                          <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-sky-100 text-sky-800">
                            Mercado Livre
                          </span>
                        </div>
                        <h3 className="font-bold text-slate-900 text-base">Mercado Pago</h3>
                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                          Ecossistema consagrado do Mercado Livre. Checkout Transparente com alta conversão e aprovação imediata.
                        </p>
                        <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold">
                          <span className="text-sky-700">Mercado Pago IP (323)</span>
                          {gwForm.activeGateway === 'mercadopago' && <span className="text-sky-600 font-bold">✓ Selecionado</span>}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* BANNER EXPLICATIVO: FLUXO DO DINHEIRO PARA O GATEWAY SELECIONADO */}
                  <div className={`bg-gradient-to-r ${currentGw.brandColor} rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden`}>
                    <div className="relative z-10">
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div className="flex items-center gap-3">
                          <div className="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur-md text-white flex items-center justify-center font-black text-xl shadow-lg">
                            {currentGw.name.slice(0, 2).toUpperCase()}
                          </div>
                          <div>
                            <h2 className="text-xl font-black text-white">Gateway Ativo: {currentGw.name}</h2>
                            <p className="text-xs text-white/80">{currentGw.company} • {currentGw.bankCode}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                            gwForm.environment === 'production'
                              ? 'bg-emerald-500/30 text-white border border-emerald-300/40'
                              : 'bg-amber-500/30 text-white border border-amber-300/40'
                          }`}>
                            {gwForm.environment === 'production' ? '🚀 MODO PRODUÇÃO (DINHEIRO REAL)' : '🧪 MODO TESTES (SANDBOX)'}
                          </span>
                        </div>
                      </div>

                      <div className="bg-black/25 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-white/15 mb-2">
                        <h4 className="text-sm font-bold text-white mb-2 flex items-center gap-2">
                          <Icon name="sparkles" className="w-4 h-4 text-amber-300" />
                          <span>Onde cai o dinheiro quando o cliente paga?</span>
                        </h4>
                        <p className="text-xs text-white/90 leading-relaxed mb-3">
                          Quando um freelancer pagar <strong>R$ {Number(gwForm.freelancerPrice).toFixed(2).replace('.', ',')}</strong> ou uma empresa pagar <strong>R$ {Number(gwForm.companyPrice).toFixed(2).replace('.', ',')}</strong> via PIX:
                        </p>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                          <div className="bg-black/30 rounded-xl p-3 border border-white/10">
                            <div className="font-bold text-amber-300 mb-1">1. Cliente Paga no Banco</div>
                            <div className="text-white/80 text-[11px]">No app de qualquer banco via QR Code ou Copia-e-Cola gerado pelo {currentGw.name}.</div>
                          </div>
                          <div className="bg-black/30 rounded-xl p-3 border border-white/10">
                            <div className="font-bold text-emerald-300 mb-1">2. Saldo na sua Conta {currentGw.name}</div>
                            <div className="text-white/80 text-[11px]">O dinheiro cai <strong>diretamente no saldo da sua conta do {currentGw.name}</strong>, livre para sacar ou transferir via PIX sem taxas.</div>
                          </div>
                          <div className="bg-black/30 rounded-xl p-3 border border-white/10">
                            <div className="font-bold text-cyan-300 mb-1">3. Webhook Libera +30d</div>
                            <div className="text-white/80 text-[11px]">O {currentGw.name} notifica o app Freelancer BC no mesmo instante e a assinatura é liberada sem intervenção manual.</div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* FORMULÁRIO DE CONFIGURAÇÃO */}
                  <form onSubmit={handleSaveGw} className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">
                    <div className="border-b border-slate-100 pb-4 flex justify-between items-center">
                      <div>
                        <h3 className="text-lg font-black text-slate-900">Credenciais & Integração com {currentGw.name}</h3>
                        <p className="text-xs text-slate-500">Configure suas credenciais para vincular os pagamentos à sua conta oficial.</p>
                      </div>
                      <a
                        href={currentGw.portalUrl}
                        target="_blank"
                        rel="noreferrer"
                        className={`text-xs font-bold flex items-center gap-1.5 ${currentGw.textColor} hover:underline`}
                      >
                        <span>Acessar {currentGw.portalName}</span>
                        <Icon name="externalLink" className="w-3.5 h-3.5" />
                      </a>
                    </div>

                    {/* 1. SELEÇÃO DO AMBIENTE */}
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                        Ambiente de Operação
                      </label>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button
                          type="button"
                          onClick={() => setGwForm(prev => ({ ...prev, environment: 'production' }))}
                          className={`p-4 rounded-2xl border-2 text-left transition flex items-start gap-3 ${
                            gwForm.environment === 'production'
                              ? 'border-emerald-600 bg-emerald-50/60 shadow-sm'
                              : 'border-slate-200 hover:border-slate-300 bg-white'
                          }`}
                        >
                          <span className="text-2xl">🚀</span>
                          <div>
                            <div className="font-bold text-sm text-slate-900 flex items-center gap-2">
                              <span>Modo Produção</span>
                              <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold">Oficial</span>
                            </div>
                            <div className="text-xs text-slate-500 mt-0.5">
                              Cobranças reais via PIX. O dinheiro entra na sua conta bancária do {currentGw.name}.
                            </div>
                          </div>
                        </button>

                        <button
                          type="button"
                          onClick={() => setGwForm(prev => ({ ...prev, environment: 'sandbox' }))}
                          className={`p-4 rounded-2xl border-2 text-left transition flex items-start gap-3 ${
                            gwForm.environment === 'sandbox'
                              ? 'border-amber-600 bg-amber-50/60 shadow-sm'
                              : 'border-slate-200 hover:border-slate-300 bg-white'
                          }`}
                        >
                          <span className="text-2xl">🧪</span>
                          <div>
                            <div className="font-bold text-sm text-slate-900 flex items-center gap-2">
                              <span>Modo Sandbox</span>
                              <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold">Testes</span>
                            </div>
                            <div className="text-xs text-slate-500 mt-0.5">
                              Ambiente de testes para simular pagamentos sem movimentar dinheiro real.
                            </div>
                          </div>
                        </button>
                      </div>
                    </div>

                    {/* 2. DADOS DA CONTA E BENEFICIÁRIO */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                          Nome / Razão Social do Beneficiário
                        </label>
                        <input
                          type="text"
                          required
                          value={gwForm.receiverName}
                          onChange={(e) => setGwForm({ ...gwForm, receiverName: e.target.value })}
                          placeholder="Ex: Freelancer BC Tecnologia ou Seu Nome"
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium"
                        />
                        <span className="text-[11px] text-slate-400 mt-1 block">
                          Nome que o cliente verá no app do banco dele ao pagar o PIX.
                        </span>
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                          Chave PIX da sua Conta {currentGw.name}
                        </label>
                        <input
                          type="text"
                          required
                          value={gwForm.pixKey}
                          onChange={(e) => setGwForm({ ...gwForm, pixKey: e.target.value })}
                          placeholder="Ex: CNPJ, CPF, e-mail ou chave aleatória"
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium font-mono"
                        />
                        <span className="text-[11px] text-slate-400 mt-1 block">
                          A chave cadastrada no seu aplicativo do {currentGw.name}.
                        </span>
                      </div>
                    </div>

                    {/* 3. CAMPOS ESPECÍFICOS DO GATEWAY */}
                    <div className="space-y-4 pt-2 border-t border-slate-100">
                      {/* SE FOR INFINITEPAY */}
                      {gwForm.activeGateway === 'infinitepay' && (
                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              API Key / Token de Acesso da InfinitePay
                            </label>
                            <div className="relative">
                              <input
                                type={showToken ? 'text' : 'password'}
                                value={gwForm.infinitepayApiKey}
                                onChange={(e) => setGwForm({ ...gwForm, infinitepayApiKey: e.target.value })}
                                placeholder="inf_live_..."
                                className="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 text-xs font-mono"
                              />
                              <button
                                type="button"
                                onClick={() => setShowToken(!showToken)}
                                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
                                title={showToken ? 'Ocultar' : 'Exibir'}
                              >
                                <Icon name={showToken ? 'eyeOff' : 'eye'} className="w-4 h-4" />
                              </button>
                            </div>
                            <span className="text-[11px] text-slate-400 mt-1 block">
                              Encontrado no App InfinitePay em Configurações &gt; Vendas Online / API.
                            </span>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Identificador da Carteira / Wallet ID (Opcional)
                            </label>
                            <input
                              type="text"
                              value={gwForm.infinitepayWallet}
                              onChange={(e) => setGwForm({ ...gwForm, infinitepayWallet: e.target.value })}
                              placeholder="wallet_..."
                              className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 text-xs font-mono"
                            />
                          </div>
                        </div>
                      )}

                      {/* SE FOR PAGBANK */}
                      {gwForm.activeGateway === 'pagbank' && (
                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Token de Produção PagBank
                            </label>
                            <div className="relative">
                              <input
                                type={showToken ? 'text' : 'password'}
                                value={gwForm.pagbankToken}
                                onChange={(e) => setGwForm({ ...gwForm, pagbankToken: e.target.value })}
                                placeholder="PAGBANK_TOKEN_..."
                                className="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs font-mono"
                              />
                              <button
                                type="button"
                                onClick={() => setShowToken(!showToken)}
                                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
                                title={showToken ? 'Ocultar' : 'Exibir'}
                              >
                                <Icon name={showToken ? 'eyeOff' : 'eye'} className="w-4 h-4" />
                              </button>
                            </div>
                            <span className="text-[11px] text-slate-400 mt-1 block">
                              Gerado em developer.pagbank.com.br &gt; Minha Conta &gt; Credenciais.
                            </span>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Chave Pública (Public Key PagBank)
                            </label>
                            <input
                              type="text"
                              value={gwForm.pagbankPublicKey}
                              onChange={(e) => setGwForm({ ...gwForm, pagbankPublicKey: e.target.value })}
                              placeholder="PUB_KEY_..."
                              className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs font-mono"
                            />
                          </div>
                        </div>
                      )}

                      {/* SE FOR MERCADO PAGO */}
                      {gwForm.activeGateway === 'mercadopago' && (
                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Access Token ({gwForm.environment === 'production' ? 'Produção: APP_USR-...' : 'Sandbox: TEST-...'})
                            </label>
                            <div className="relative">

                    </div>

    // ==========================================

    // ==========================================
    // SISTEMA DE NOTIFICAÇÕES EM TEMPO REAL PARA FREELANCERS
    // ==========================================
    function playNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        
        // Tom suave duplo: 587.33 Hz (D5) -> 880 Hz (A5)
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
        
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    async function sendSystemNotification(title, options = {}) {
      playNotificationSound();
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate([120, 80, 120]); } catch (e) {}
      }

      if (typeof window !== 'undefined' && 'Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            const notif = new Notification(title, {
              icon: '/icon.svg',
              badge: '/icon.svg',
              ...options
            });
            notif.onclick = () => {
              window.focus();
              notif.close();
            };
          } catch (err) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.ready.then(reg => {
                reg.showNotification(title, {
                  icon: '/icon.svg',
                  badge: '/icon.svg',
                  ...options
                }).catch(() => {});
              }).catch(() => {});
            }
          }
        }
      }
    }

    async function requestNotificationPermission() {
      if (typeof window !== 'undefined' && 'Notification' in window) {
        try {
          const perm = await Notification.requestPermission();
          return perm === 'granted';
        } catch (e) {
          return false;
        }
      }
      return false;
    }

    function isJobMatchingFreelancer(job, freelancer) {
      if (!freelancer || freelancer.role !== 'freelancer' || !job) return false;
      if (job.status !== 'ativa') return false;

      const targetCategories = (Array.isArray(freelancer.alertCategories) && freelancer.alertCategories.length > 0)
        ? freelancer.alertCategories
        : [freelancer.profession || 'Garçom'];

      const jCat = (job.category || '').toLowerCase();
      const jTitle = (job.title || '').toLowerCase();

      return targetCategories.some(cat => {
        const c = (cat || '').toLowerCase();
        if (!c) return false;
        if (jCat.includes(c) || c.includes(jCat)) return true;
        const words = c.split(/[\s&/]+/).filter(w => w.length >= 3);
        return words.some(w => jTitle.includes(w));
      });
    }

    function ModalCentralNotificacoes({ 
      freelancer, 
      notifications, 
      jobs, 
      onClose, 
      onSelectJob, 
      onMarkAllRead, 
      onUpdateCategories,
      onTestNotification 
    }) {
      const [permState, setPermState] = useState(() => {
        if (typeof window !== 'undefined' && 'Notification' in window) {
          return Notification.permission;
        }
        return 'unsupported';
      });

      const userCategories = (Array.isArray(freelancer.alertCategories) && freelancer.alertCategories.length > 0)
        ? freelancer.alertCategories
        : [freelancer.profession || 'Garçom'];

      const toggleCategory = (cat) => {
        let updated;
        if (userCategories.includes(cat)) {
          updated = userCategories.filter(c => c !== cat);
          if (updated.length === 0) updated = [freelancer.profession || 'Garçom'];
        } else {
          updated = [...userCategories, cat];
        }
        onUpdateCategories(updated);
      };

      const handleEnableNativeNotif = async () => {
        const granted = await requestNotificationPermission();
        if (granted) {
          setPermState('granted');
          sendSystemNotification('🎉 Alertas Ativados com Sucesso!', {
            body: 'Você receberá avisos sonoros e na tela sempre que surgir uma vaga para seu perfil em BC!'
          });
        } else {
          if (typeof window !== 'undefined' && 'Notification' in window) {
            setPermState(Notification.permission);
          }

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-hidden">

                    Ativar

              <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-slate-800 text-xs uppercase tracking-wider">

                  <span className="text-[10px] text-slate-400">Clique para ativar/desativar</span>

                <div className="flex flex-wrap gap-1.5">

                      <button

    function ModalComplementoCandidatura({ job, freelancer, onClose, onConfirm }) {
      const [age, setAge] = useState(freelancer?.age ? String(freelancer.age) : '');

      const [city, setCity] = useState(freelancer?.city || 'Balneário Camboriú');
      const [experience, setExperience] = useState(freelancer?.experience || '');
      const [error, setError] = useState('');

      const remun = formatRemuneration(job);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        if (!age || Number(age) < 16) {
          setError('Por favor, informe uma idade válida (mínimo 16 anos).');
          return;
        }
        if (!experienceTime.trim()) {
          setError('Selecione quanto tempo você já atua na área.');
          return;
        }
        if (!city.trim()) {
          setError('Informe sua cidade ou região de atuação.');
          return;

          age: Number(age),
          experienceTime: experienceTime.trim(),
          city: city.trim(),
          experience: experience.trim()

              >
                Voltar
              </button>

                type="submit"
                className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs sm:text-sm shadow-lg shadow-emerald-500/25 transition active:scale-95 flex items-center gap-1.5"
              >
                <Icon name="whatsapp" className="w-4 h-4" />
                <span>Confirmar & Chamar no WhatsApp</span>
              </button>
            </div>
          </form>
        </div>
      );
    }

    // ==========================================
