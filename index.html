    function ModalEditarVaga({ company, initialJob, onClose, onSave }) {
      const isEditing = Boolean(initialJob);
      const [title, setTitle] = useState(initialJob ? initialJob.title : '');
      const [companyName, setCompanyName] = useState(initialJob?.companyName || company.name || '');
      const [category, setCategory] = useState(initialJob ? initialJob.category : 'Garçom');
      
      // Remuneration model states: 'diaria_fixa' | 'por_hora' | 'so_comissao' | 'fixo_mais_comissao'
      const [paymentType, setPaymentType] = useState(initialJob?.paymentType || 'diaria_fixa');
      const [rate, setRate] = useState(initialJob ? String(initialJob.rate || '') : '250');
      const [hourlyRate, setHourlyRate] = useState(initialJob?.hourlyRate ? String(initialJob.hourlyRate) : '15');
      const [commissionRate, setCommissionRate] = useState(initialJob?.commissionRate ? String(initialJob.commissionRate) : '7');
      const [commissionDetail, setCommissionDetail] = useState(initialJob?.commissionDetail || '');

      const [totalSpots, setTotalSpots] = useState(initialJob ? initialJob.totalSpots : 3);
      const [filledSpots, setFilledSpots] = useState(initialJob ? initialJob.filledSpots : 0);
      const [date, setDate] = useState(initialJob ? initialJob.date : '');
      const [startTime, setStartTime] = useState(initialJob ? initialJob.startTime : '18:00');
      const [endTime, setEndTime] = useState(initialJob ? initialJob.endTime : '02:00');
      const [address, setAddress] = useState(initialJob ? initialJob.address : 'Av. Atlântica, Balneário Camboriú');
      const [attire, setAttire] = useState(initialJob ? initialJob.attire : 'All Black');
      const [whatsapp, setWhatsapp] = useState(initialJob ? initialJob.whatsapp : (company.phone || ''));

      const shiftHours = calculateShiftHours(startTime, endTime);
      const estimatedHourlyTotal = shiftHours > 0 ? (Number(hourlyRate) * shiftHours) : 0;

      // Live remuneration preview object
      const previewRemun = formatRemuneration({
        paymentType,
        rate: Number(rate),
        hourlyRate: Number(hourlyRate),
        commissionRate: Number(commissionRate),
        commissionDetail,
        startTime,
        endTime
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          ...(initialJob || {}),
          id: initialJob ? initialJob.id : `job-${Date.now()}`,
          companyId: company.id,
          companyName: companyName.trim() || company.name,
          title: title.trim(),
          category,
          paymentType,
          rate: (paymentType === 'so_comissao') ? 0 : (paymentType === 'por_hora' ? Number(hourlyRate) : (Number(rate) || 0)),
          hourlyRate: paymentType === 'por_hora' ? (Number(hourlyRate) || 0) : null,
          commissionRate: (paymentType === 'so_comissao' || paymentType === 'fixo_mais_comissao') ? (Number(commissionRate) || 0) : null,
          commissionDetail: (paymentType === 'so_comissao' || paymentType === 'fixo_mais_comissao') ? commissionDetail.trim() : null,
          totalSpots: Number(totalSpots) || 1,
          filledSpots: Number(filledSpots) || 0,
          status: (Number(filledSpots) >= Number(totalSpots)) ? 'encerrada' : (initialJob ? initialJob.status : 'ativa'),
          date,
          startTime,
          endTime,
          address: address.trim(),
          attire: attire.trim(),
          whatsapp: whatsapp.replace(/\D/g, ''),
          clicks: initialJob ? initialJob.clicks : 0,
          applicants: initialJob ? initialJob.applicants : [],
          createdAt: initialJob ? initialJob.createdAt : new Date().toISOString()
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-hidden">
          <form
            onSubmit={handleSubmit}
            className="bg-white w-full sm:max-w-xl max-h-[92vh] max-h-[92dvh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in"
          >
            {/* Header Fixo no Topo - Sempre visível, nunca corta */}
            <div className="shrink-0 px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white z-10">
              <div>
                <h3 className="text-lg sm:text-xl font-black text-slate-900 leading-tight">
                  {isEditing ? 'Editar Vaga' : 'Publicar Nova Vaga'}
                </h3>
                <p className="text-xs text-slate-500 mt-0.5">
                  Preencha os dados da vaga e o valor para os freelancers
                </p>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Fechar"
                className="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-700 flex items-center justify-center transition active:scale-95 shrink-0"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Corpo com Rolagem Suave - Sobe e desce sem travar em celular */}
            <div className="flex-1 overflow-y-auto overscroll-contain p-4 sm:p-6 space-y-4 text-xs">
              {/* Título da Vaga e Nome do Estabelecimento */}
              <div className="space-y-3">
                <div>
                  <label className="font-bold text-slate-800 block mb-1 text-xs">
                    Título da Vaga / Função <span className="text-rose-500">*</span>
                  </label>
                  <input
                    required
                    autoFocus
                    placeholder="Ex: Bartender para Balada, Garçom para Festa VIP..."
                    value={title}
                    onChange={e => setTitle(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition text-sm text-slate-900 placeholder-slate-400"
                  />
                </div>

                <div>
                  <label className="font-bold text-slate-800 block mb-1 text-xs">
                    Nome do Estabelecimento / Empresa / Evento <span className="text-rose-500">*</span>
                  </label>
                  <input
                    required
                    placeholder="Ex: Habbitat, Green Valley, Taj Bar, Buffet Elegance..."
                    value={companyName}
                    onChange={e => setCompanyName(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition text-sm text-slate-900 placeholder-slate-400"
                  />
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1 text-xs">Categoria Profissional</label>
                <select
                  value={category}
                  onChange={e => setCategory(e.target.value)}
                  className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-medium text-sm text-slate-800 focus:bg-white"
                >
                  {CATEGORIES.filter(c => c !== 'Todos').map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              {/* SELETOR DE MODELO DE REMUNERAÇÃO */}
              <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
                <label className="font-bold text-slate-800 block uppercase tracking-wider text-[11px]">
                  Como será o pagamento da vaga?
                </label>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <button
                    type="button"
                    onClick={() => setPaymentType('diaria_fixa')}
                    className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
                      paymentType === 'diaria_fixa'
                        ? 'bg-emerald-50 border-emerald-500 ring-2 ring-emerald-500/20 text-emerald-950 font-bold'
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    <span className="text-base mb-1">💵</span>
                    <span className="text-xs font-bold leading-tight">Diária Fixa</span>
                    <span className="text-[10px] text-slate-400 font-normal">Valor fechado</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setPaymentType('por_hora')}
                    className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
                      paymentType === 'por_hora'
                        ? 'bg-cyan-50 border-cyan-500 ring-2 ring-cyan-500/20 text-cyan-950 font-bold'
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    <span className="text-base mb-1">⏱️</span>
                    <span className="text-xs font-bold leading-tight">Por Hora</span>
                    <span className="text-[10px] text-slate-400 font-normal">Ex: R$ 15/h</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setPaymentType('so_comissao')}
                    className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
                      paymentType === 'so_comissao'
                        ? 'bg-purple-50 border-purple-500 ring-2 ring-purple-500/20 text-purple-950 font-bold'
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    <span className="text-base mb-1">📈</span>
                    <span className="text-xs font-bold leading-tight">Só Comissão</span>
                    <span className="text-[10px] text-slate-400 font-normal">% s/ vendas</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setPaymentType('fixo_mais_comissao')}
                    className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
                      paymentType === 'fixo_mais_comissao'
                        ? 'bg-amber-50 border-amber-500 ring-2 ring-amber-500/20 text-amber-950 font-bold'
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    <span className="text-base mb-1">⚡</span>
                    <span className="text-xs font-bold leading-tight">Fixo + Comis.</span>
                    <span className="text-[10px] text-slate-400 font-normal">Base + % vendas</span>
                  </button>
                </div>

                {/* CAMPOS DINÂMICOS DO PAGAMENTO */}
                {paymentType === 'diaria_fixa' && (
                  <div className="space-y-2 pt-1">
                    <label className="font-bold text-slate-700 block">Valor da Diária (R$)</label>
                    <input
                      type="number"
                      required
                      min="1"
                      value={rate}
                      onChange={e => setRate(e.target.value)}
                      placeholder="Ex: 250"
                      className="w-full p-2.5 bg-white border border-slate-200 rounded-xl font-black text-emerald-600 text-base"
                    />
                    <div className="flex gap-1.5 flex-wrap">
                      {['180', '200', '220', '250', '300'].map(val => (
                        <button
                          key={val}
                          type="button"
                          onClick={() => setRate(val)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition ${
                            rate === val ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                          }`}
                        >
                          R$ {val}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {paymentType === 'por_hora' && (
                  <div className="space-y-2 pt-1">
                    <label className="font-bold text-slate-700 block">Valor Pago por Hora (R$/h)</label>
                    <input
                      type="number"
                      required
                      min="1"
                      step="0.5"
                      value={hourlyRate}
                      onChange={e => setHourlyRate(e.target.value)}
                      placeholder="Ex: 15.00"
                      className="w-full p-2.5 bg-white border border-slate-200 rounded-xl font-black text-cyan-700 text-base"
                    />
                    <div className="flex gap-1.5 flex-wrap">
                      {['15', '18', '20', '25', '30'].map(val => (
                        <button
                          key={val}
                          type="button"
                          onClick={() => setHourlyRate(val)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition ${
                            hourlyRate === val ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                          }`}
                        >
                          R$ {val}/h
                        </button>
                      ))}
                    </div>
                    {shiftHours > 0 && (
                      <div className="p-2.5 bg-cyan-50 border border-cyan-200 rounded-xl text-xs text-cyan-900 font-medium">
                        ⏱️ Turno de <strong>{shiftHours} horas</strong> ({startTime} às {endTime}) = Estimativa de <strong>{formatMoney(estimatedHourlyTotal)}</strong> por profissional.
                      </div>
                    )}
                  </div>
                )}

                {paymentType === 'so_comissao' && (
                  <div className="space-y-2 pt-1">
                    <label className="font-bold text-slate-700 block">Porcentagem de Comissão (%) sobre Vendas</label>
                    <div className="flex gap-2">
                      <input
                        type="number"
                        required
                        min="0.5"
                        max="100"
                        step="0.5"
                        value={commissionRate}
                        onChange={e => setCommissionRate(e.target.value)}
                        placeholder="Ex: 7"
                        className="w-full p-2.5 bg-white border border-slate-200 rounded-xl font-black text-purple-700 text-base"
                      />
                      <span className="px-4 bg-slate-200 text-slate-700 font-black rounded-xl flex items-center justify-center text-sm">%</span>
                    </div>
                    <div className="flex gap-1.5 flex-wrap">
                      {['3', '5', '7', '10', '15'].map(val => (
                        <button
                          key={val}
                          type="button"
                          onClick={() => setCommissionRate(val)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition ${
                            commissionRate === val ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                          }`}
                        >
                          {val}% da venda
                        </button>
                      ))}
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block text-[11px] mb-1">Detalhes da Comissão (Opcional)</label>
                      <input
                        placeholder="Ex: sobre venda de drinks e garrafas, venda de camarotes..."
                        value={commissionDetail}
                        onChange={e => setCommissionDetail(e.target.value)}
                        className="w-full p-2 bg-white border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                  </div>
                )}

                {paymentType === 'fixo_mais_comissao' && (
                  <div className="space-y-3 pt-1">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Diária Base (R$)</label>
                        <input
                          type="number"
                          required
                          min="0"
                          value={rate}
                          onChange={e => setRate(e.target.value)}
                          placeholder="Ex: 150"
                          className="w-full p-2.5 bg-white border border-slate-200 rounded-xl font-black text-amber-900"
                        />
                      </div>
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Comissão (%)</label>
                        <input
                          type="number"
                          required
                          min="0.5"
                          max="100"
                          step="0.5"
                          value={commissionRate}
                          onChange={e => setCommissionRate(e.target.value)}
                          placeholder="Ex: 5"
                          className="w-full p-2.5 bg-white border border-slate-200 rounded-xl font-black text-amber-900"
                        />
                      </div>
                    </div>
                    <div className="flex gap-1.5 flex-wrap">
                      {['3', '5', '7', '10'].map(val => (
                        <button
                          key={val}
                          type="button"
                          onClick={() => setCommissionRate(val)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition ${
                            commissionRate === val ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                          }`}
                        >
                          +{val}% das vendas
                        </button>
                      ))}
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block text-[11px] mb-1">Detalhes da Comissão (Opcional)</label>
                      <input
                        placeholder="Ex: sobre vendas no bar, consumação de garrafas..."
                        value={commissionDetail}
                        onChange={e => setCommissionDetail(e.target.value)}
                        className="w-full p-2 bg-white border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                  </div>
                )}

                {/* Live Preview Pill */}
                <div className="p-2.5 bg-white border border-slate-200 rounded-xl flex items-center justify-between">
                  <span className="text-[11px] font-bold text-slate-500">👀 Como o freelancer verá:</span>
                  <div className="text-right">
                    <span className="font-black text-slate-900 text-xs">{previewRemun.display}</span>
                    <span className={`ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold ${previewRemun.badgeColor}`}>
                      {previewRemun.label}
                    </span>
                  </div>
                </div>
              </div>

              {/* VAGAS E HORÁRIO */}
              <div className="grid grid-cols-2 gap-3 p-3 bg-indigo-50/70 rounded-xl border border-indigo-100">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Vagas Totais</label>
                  <input type="number" min="1" required value={totalSpots} onChange={e => setTotalSpots(e.target.value)} className="w-full p-2 bg-white border rounded-xl font-bold" />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Preenchidas</label>
                  <input type="number" min="0" value={filledSpots} onChange={e => setFilledSpots(e.target.value)} className="w-full p-2 bg-white border rounded-xl font-bold" />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Data</label>
                  <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full p-2 bg-slate-50 border rounded-xl" />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Início</label>
                  <input type="time" required value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full p-2 bg-slate-50 border rounded-xl" />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Fim</label>
                  <input type="time" required value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full p-2 bg-slate-50 border rounded-xl" />
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Endereço em Balneário Camboriú</label>
                <input required value={address} onChange={e => setAddress(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">WhatsApp de Contato</label>
                <input required value={formatPhone(whatsapp)} onChange={e => setWhatsapp(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl font-mono" />
              </div>
            </div>

            {/* Rodapé Fixo na Base - Sempre visível com botões de ação */}
            <div className="shrink-0 p-3.5 sm:p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-2.5 z-10">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2.5 border border-slate-200 text-slate-700 font-bold rounded-xl text-xs sm:text-sm hover:bg-white transition"
              >
                Cancelar
              </button>
              <button
                type="submit"
                className="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-emerald-600 hover:from-indigo-500 hover:to-emerald-500 text-white font-black rounded-xl text-xs sm:text-sm shadow-lg shadow-indigo-500/25 transition active:scale-95 flex items-center gap-1.5"
              >
                <Icon name="checkCircle" className="w-4 h-4" />
                <span>{isEditing ? 'Salvar Alterações' : 'Publicar Vaga'}</span>
              </button>
            </div>
          </form>
        </div>
      );
    }
    function ModalCandidatosWhats({ job, onClose, onHire, onOpenProfile }) {
      const applicants = job.applicants || [];
      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-hidden">
          <div className="bg-white w-full sm:max-w-xl max-h-[90vh] max-h-[90dvh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in">
            <div className="shrink-0 px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white z-10">
              <div>
                <h3 className="text-lg font-black text-slate-900 leading-tight">Quem Chamou no Whats ({applicants.length})</h3>
                <p className="text-xs text-slate-500 mt-0.5">{job.title} • {job.companyName}</p>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition active:scale-95"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto overscroll-contain p-4 sm:p-5 space-y-3">
              {applicants.length === 0 ? (
                <div className="text-center py-8 text-slate-400 text-xs">
                  Nenhum freelancer chamou no WhatsApp ainda para esta vaga.
                </div>
              ) : (
                applicants.map((cand, idx) => (
                  <div key={idx} className="p-3.5 bg-slate-50 hover:bg-slate-100/80 border border-slate-200/80 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs transition">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span className="font-extrabold text-slate-900 text-sm">{cand.name}</span>
                        {cand.age && (
                          <span className="px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold">
                            {cand.age} anos
                          </span>
                        )}
                      </div>
                      <div className="text-indigo-600 font-bold">
                        {cand.profession || 'Freelancer'}
                        {cand.experienceTime && <span className="text-slate-500 font-normal"> • {cand.experienceTime}</span>}
                      </div>
                      {cand.city && (
                        <div className="text-slate-500 text-[11px]">📍 {cand.city}</div>
                      )}
                      {cand.experience && (
                        <div className="text-slate-600 text-[11px] bg-white p-2 rounded-lg border border-slate-100 italic">
                          "{cand.experience}"
                        </div>
                      )}
                      {cand.phone && (
                        <div className="text-slate-500 text-[11px]">📱 {formatPhone(cand.phone)}</div>
                      )}
                      {cand.clickedAt && (
                        <div className="text-[10px] text-slate-400">
                          🕒 Solicitou em: {new Date(cand.clickedAt).toLocaleString('pt-BR')}
                        </div>
                      )}
                    </div>
                    <div className="flex items-center gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-200">
                      {onOpenProfile && (
                        <button
                          type="button"
                          onClick={() => onOpenProfile(cand.freelancerId)}
                          className="px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold flex items-center gap-1 transition text-xs"
                          title="Ver Perfil Completo"
                        >
                          <Icon name="userCheck" className="w-3.5 h-3.5" />
                          <span>Perfil</span>
                        </button>
                      )}
                      {cand.phone && (
                        <a
                          href={`https://api.whatsapp.com/send?phone=${cand.phone.replace(/\D/g, '')}`}
                          target="_blank"
                          rel="noreferrer"
                          className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center gap-1.5 shadow-sm transition active:scale-95 text-xs"
                        >
                          <Icon name="whatsapp" className="w-3.5 h-3.5" />
                          <span>Conversar</span>
                        </a>
                      )}
                      <button
                        type="button"
                        onClick={() => onHire(cand.freelancerId)}
                        className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition active:scale-95 text-xs shadow-sm"
                      >
                        Contratar
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
            
            <div className="shrink-0 p-3 bg-slate-50 border-t border-slate-100 text-center">
              <button
                type="button"
                onClick={onClose}
                className="w-full py-2 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl text-xs hover:bg-slate-100 transition"
              >
                Fechar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ModalFeedbackAtribuicao({ job, candidateId, onClose, onConfirm }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 text-center shadow-2xl">
            <h3 className="text-lg font-bold text-slate-900 mb-2">Confirmar Preenchimento</h3>
            <p className="text-xs text-slate-600 mb-6">Essa vaga foi preenchida através de um freelancer do <strong>Freelancer BC</strong> ou por fora?</p>

            <div className="space-y-3 text-xs font-bold">
              <button onClick={() => onConfirm(true)} className="w-full py-3 bg-emerald-600 text-white rounded-xl">
                Sim! Contratado pelo Freelancer BC
              </button>
              <button onClick={() => onConfirm(false)} className="w-full py-2.5 bg-slate-100 text-slate-700 rounded-xl">
                Não, contratei por fora / indicação
              </button>
              <button onClick={onClose} className="w-full py-1.5 text-slate-400">Cancelar</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // PAINEL DO FREELANCER
    // ==========================================
    function FreelancerDashboard({ freelancer, jobs, invoices, onWhatsappClick, onOpenPaymentGateway, onLogout, trialInfo, onTriggerInstall, linkedAccount, onSwitchAccount, notifications = [], onOpenNotifCenter, activeJobAlert, onDismissJobAlert }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [paymentFilter, setPaymentFilter] = useState('todos');
      const [dateFilter, setDateFilter] = useState('todos'); // 'todos', 'hoje', 'amanha', 'fim_de_semana', 'custom'
      const [customDate, setCustomDate] = useState('');
      const [shiftFilter, setShiftFilter] = useState('todos'); // 'todos', 'noturno', 'diurno', 'madrugada', 'personalizado'
      const [freeFrom, setFreeFrom] = useState('');
      const [freeUntil, setFreeUntil] = useState('');

      const isAvailabilityActive = dateFilter !== 'todos' || (dateFilter === 'custom' && customDate) || shiftFilter !== 'todos' || freeFrom || freeUntil;

      const clearAvailabilityFilters = () => {
        setDateFilter('todos');
        setCustomDate('');
        setShiftFilter('todos');
        setFreeFrom('');
        setFreeUntil('');
      };

      const isAnyFilterActive = searchQuery.trim() !== '' || selectedCategory !== 'Todos' || paymentFilter !== 'todos' || isAvailabilityActive;

      const clearAllFilters = () => {
        setSearchQuery('');
        setSelectedCategory('Todos');
        setPaymentFilter('todos');
        clearAvailabilityFilters();
      };

      const filteredJobs = useMemo(() => {
        return jobs.filter(job => {
          if (job.status === 'pausada' || job.status === 'encerrada') return false;
          const matchCat = selectedCategory === 'Todos' || job.category === selectedCategory;
          const query = searchQuery.toLowerCase();
          const matchQ = !searchQuery.trim() || job.title.toLowerCase().includes(query) || (job.address || '').toLowerCase().includes(query) || (job.companyName || '').toLowerCase().includes(query);
          
          let matchPay = true;
          const pType = job.paymentType || 'diaria_fixa';
          if (paymentFilter === 'diaria_fixa') matchPay = pType === 'diaria_fixa';
          else if (paymentFilter === 'por_hora') matchPay = pType === 'por_hora';
          else if (paymentFilter === 'comissao') matchPay = (pType === 'so_comissao' || pType === 'fixo_mais_comissao');

          const matchDate = checkDateMatch(job.date, dateFilter, customDate);
          const matchShift = checkShiftMatch(job.startTime, job.endTime, shiftFilter, freeFrom, freeUntil);

          return matchCat && matchQ && matchPay && matchDate && matchShift;
        });
      }, [jobs, selectedCategory, searchQuery, paymentFilter, dateFilter, customDate, shiftFilter, freeFrom, freeUntil]);

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col pb-20">
          <header className="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-emerald-400 flex items-center justify-center font-bold">
                  <Icon name="briefcase" className="w-4 h-4" />
                </div>
                <h1 className="font-bold text-base">Freelancer BC</h1>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
{/* Botão de Alertas / Sininho de Notificações */}
                <button
                  type="button"
                  onClick={onOpenNotifCenter}
                  className="relative p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition active:scale-95"
                  title="Alertas de Vagas para seu Perfil"
                >
                  <Icon name="bell" className="w-4 h-4" />
                  {notifications.filter(n => !n.read).length > 0 && (
                    <span className="absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white text-[10px] font-black rounded-full flex items-center justify-center animate-bounce shadow">
                      {notifications.filter(n => !n.read).length}
                    </span>
                  )}
                </button>

                <button
                  type="button"
                  onClick={onTriggerInstall}
                  className="px-2.5 sm:px-3 py-1.5 bg-gradient-to-r from-indigo-600 to-emerald-500 hover:from-indigo-500 hover:to-emerald-400 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition active:scale-95"
                  title="Virar App no Celular (Adicionar à Tela de Início)"
                >
                  <Icon name="smartphone" className="w-3.5 h-3.5" />
                  <span className="hidden xs:inline">Virar App</span>
                </button>

                {linkedAccount && (
                  <button
                    type="button"
                    onClick={onSwitchAccount}
                    className="px-2.5 sm:px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/40 rounded-xl text-xs font-bold flex items-center gap-1.5 transition"
                    title={`Alternar para Perfil Empresa (${linkedAccount.name})`}
                  >
                    <Icon name="refresh" className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Perfil Empresa:</span> <span className="max-w-[80px] sm:max-w-none truncate">{linkedAccount.name.split(' ')[0]}</span>
                  </button>
                )}


                <button type="button" onClick={onLogout} title="Sair" className="p-2 text-slate-400 hover:text-white transition"><Icon name="logOut" className="w-4 h-4" /></button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 sm:px-6 pt-6 flex-1 w-full">
            {/* Banner Flutuante de Nova Vaga em Tempo Real */}
            {activeJobAlert && (
              <div className="mb-5 p-4 bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border-2 border-indigo-500/50 rounded-3xl shadow-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-white animate-in slide-in-from-top-3">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-10 h-10 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                    <Icon name="bell" className="w-5 h-5 animate-bounce" />
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] font-black uppercase tracking-wider">
                        Nova Vaga para seu Perfil!
                      </span>
                    </div>
                    <h4 className="font-extrabold text-sm text-white truncate mt-0.5">{activeJobAlert.title}</h4>
                    <p className="text-xs text-slate-300">{activeJobAlert.companyName} • <strong className="text-emerald-400">{formatRemuneration(activeJobAlert).display}</strong> • {activeJobAlert.address}</p>
                  </div>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={() => {
                      onWhatsappClick(activeJobAlert);
                      onDismissJobAlert();
                    }}
                    className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-black text-xs flex items-center gap-1.5 shadow-md transition active:scale-95"
                  >
                    <Icon name="whatsapp" className="w-3.5 h-3.5" />
                    <span>Ver Vaga & Candidatar-se</span>
                  </button>
                  <button
                    type="button"
                    onClick={onDismissJobAlert}
                    className="p-2 text-slate-400 hover:text-white transition"
                    title="Fechar alerta"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            )}
            <div className="bg-white p-5 rounded-3xl border border-slate-200 mb-6 space-y-3.5 shadow-sm">
              {/* Search Bar */}
              <div className="relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Pesquisar vagas em Balneário Camboriú por cargo, local ou empresa..."
                  className="w-full p-3.5 pl-10 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-hidden transition"
                />
                <div className="absolute left-3.5 top-3.5 text-slate-400 pointer-events-none">
                  <Icon name="search" className="w-4 h-4" />
                </div>
                {searchQuery && (
                  <button
                    type="button"
                    onClick={() => setSearchQuery('')}
                    className="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 p-0.5"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                )}
              </div>
              
              {/* Category Pills */}
              <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                      selectedCategory === cat ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* AVAILABILITY & FREE HOURS FILTER PANEL */}
              <div className="bg-gradient-to-br from-indigo-50/70 via-slate-50 to-emerald-50/70 p-4 rounded-2xl border border-indigo-100/90 space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-7 h-7 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-xs">
                      <Icon name="clock" className="w-3.5 h-3.5" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="text-xs font-black text-slate-900">Quando você pode trabalhar?</h3>
                        {isAvailabilityActive && (
                          <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-extrabold rounded-full animate-pulse">
                            Filtro Ativo
                          </span>
                        )}
                      </div>
                      <p className="text-[11px] text-slate-500">Defina seu dia ou horário livre para ver só o que bate com a sua disponibilidade</p>
                    </div>
                  </div>
                  {isAvailabilityActive && (
                    <button
                      type="button"
                      onClick={clearAvailabilityFilters}
                      className="text-[11px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 bg-white px-2.5 py-1 rounded-xl border border-indigo-200 shadow-2xs hover:bg-indigo-50 transition"
                      title="Limpar filtros de disponibilidade"
                    >
                      <Icon name="xCircle" className="w-3 h-3" />
                      Limpar
                    </button>
                  )}
                </div>

                {/* Filter by Day */}
                <div className="space-y-1.5">
                  <div className="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                    <Icon name="calendar" className="w-3.5 h-3.5 text-indigo-500" />
                    <span>Dia disponível:</span>
                  </div>
                  <div className="flex flex-wrap items-center gap-1.5">
                    {[
                      { id: 'todos', label: 'Qualquer dia' },
                      { id: 'hoje', label: '📅 Hoje' },
                      { id: 'amanha', label: '☀️ Amanhã' },
                      { id: 'fim_de_semana', label: '🎉 Fim de Semana' },
                      { id: 'custom', label: '🗓️ Outra Data' }
                    ].map(d => (
                      <button
                        key={d.id}
                        type="button"
                        onClick={() => {
                          setDateFilter(d.id);
                          if (d.id !== 'custom') setCustomDate('');
                        }}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                          dateFilter === d.id
                            ? 'bg-indigo-600 text-white shadow-xs'
                            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {d.label}
                      </button>
                    ))}
                    {dateFilter === 'custom' && (
                      <input
                        type="date"
                        value={customDate}
                        onChange={e => setCustomDate(e.target.value)}
                        className="px-2.5 py-1 bg-white border border-indigo-300 rounded-xl text-xs font-bold text-slate-800 shadow-2xs focus:ring-2 focus:ring-indigo-500"
                      />
                    )}
                  </div>
                </div>

                {/* Filter by Shift & Free Hours */}
                <div className="space-y-1.5 pt-2 border-t border-indigo-100/70">
                  <div className="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                    <Icon name="clock" className="w-3.5 h-3.5 text-indigo-500" />
                    <span>Horário livre / Turno:</span>
                  </div>
                  <div className="flex flex-wrap items-center gap-1.5">
                    {[
                      { id: 'todos', label: 'Qualquer horário' },
                      { id: 'noturno', label: '🌙 Noite (após 18h)' },
                      { id: 'diurno', label: '☀️ Diurno (manhã/tarde)' },
                      { id: 'madrugada', label: '🦉 Madrugada (após 22h)' },
                      { id: 'personalizado', label: '⏰ Digitar Horário Livre' }
                    ].map(s => (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => {
                          setShiftFilter(s.id);
                          if (s.id !== 'personalizado') {
                            setFreeFrom('');
                            setFreeUntil('');
                          }
                        }}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                          shiftFilter === s.id
                            ? 'bg-emerald-600 text-white shadow-xs'
                            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {s.label}
                      </button>
                    ))}
                  </div>

                  {/* Custom time range picker */}
                  {(shiftFilter === 'personalizado' || freeFrom || freeUntil) && (
                    <div className="bg-white p-3.5 rounded-2xl border border-indigo-100 shadow-2xs space-y-2.5 mt-2">
                      <div className="flex flex-wrap items-center gap-3">
                        <div className="flex items-center gap-2">
                          <label className="text-xs font-bold text-slate-700 whitespace-nowrap">Estou livre a partir de:</label>
                          <input
                            type="time"
                            value={freeFrom}
                            onChange={e => {
                              setFreeFrom(e.target.value);
                              setShiftFilter('personalizado');
                            }}
                            className="px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500 transition"
                          />
                        </div>
                        <div className="flex items-center gap-2">
                          <label className="text-xs font-bold text-slate-700 whitespace-nowrap">Posso ficar até:</label>
                          <input
                            type="time"
                            value={freeUntil}
                            onChange={e => {
                              setFreeUntil(e.target.value);
                              setShiftFilter('personalizado');
                            }}
                            className="px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500 transition"
                          />
                        </div>
                        {(freeFrom || freeUntil) && (
                          <button
                            type="button"
                            onClick={() => { setFreeFrom(''); setFreeUntil(''); }}
                            className="text-[11px] font-bold text-slate-400 hover:text-slate-700 underline ml-auto"
                          >
                            Limpar horas
                          </button>
                        )}
                      </div>

                      <div className="flex flex-wrap items-center gap-1.5 pt-1">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">Atalhos rápidos:</span>
                        {[
                          { label: '18h às 00h', from: '18:00', until: '00:00' },
                          { label: '19h às 02h', from: '19:00', until: '02:00' },
                          { label: '20h às 04h', from: '20:00', until: '04:00' },
                          { label: '08h às 16h', from: '08:00', until: '16:00' },
                          { label: '12h às 20h', from: '12:00', until: '20:00' }
                        ].map((sug, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => {
                              setFreeFrom(sug.from);
                              setFreeUntil(sug.until);
                              setShiftFilter('personalizado');
                            }}
                            className="px-2.5 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-200 border border-slate-200/60 text-slate-700 rounded-lg text-[11px] font-bold transition"
                          >
                            {sug.label}
                          </button>
                        ))}
                      </div>
                      <div className="text-[10px] text-slate-400 flex items-center gap-1">
                        <span>💡</span>
                        <span>O turno da vaga precisa caber dentro do intervalo que você tem livre.</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Payment Type Filter Pills */}
              <div className="pt-2 border-t border-slate-100 flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap">Remuneração:</span>
                {[
                  { id: 'todos', label: 'Todas' },
                  { id: 'diaria_fixa', label: '💵 Diária Fixa' },
                  { id: 'por_hora', label: '⏱️ Por Hora' },
                  { id: 'comissao', label: '📈 Com Comissão' }
                ].map(p => (
                  <button
                    key={p.id}
                    type="button"
                    onClick={() => setPaymentFilter(p.id)}
                    className={`px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                      paymentFilter === p.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Results Header with Count & Reset Button */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-4 px-1 gap-2">
              <div>
                <h2 className="text-base font-black text-slate-900 flex items-center gap-2">
                  <span>Oportunidades Disponíveis ({filteredJobs.length})</span>
                  {isAnyFilterActive && (
                    <span className="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                      Filtrado
                    </span>
                  )}
                </h2>
                <p className="text-xs text-slate-400">Balneário Camboriú & Região</p>
              </div>

              {isAnyFilterActive && (
                <button
                  type="button"
                  onClick={clearAllFilters}
                  className="self-start sm:self-auto text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5"
                >
                  <Icon name="xCircle" className="w-3.5 h-3.5" />
                  <span>Limpar todos os filtros</span>
                </button>
              )}
            </div>

            {/* Job Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filteredJobs.length === 0 ? (
                <div className="col-span-full bg-white rounded-3xl border border-slate-200 p-12 text-center text-slate-500 space-y-3">
                  <div className="w-14 h-14 bg-indigo-50 text-indigo-500 rounded-2xl mx-auto flex items-center justify-center">
                    <Icon name="clock" className="w-7 h-7" />
                  </div>
                  <div>
                    <p className="font-black text-base text-slate-800">Nenhuma vaga encontrada para o horário ou data selecionados.</p>
                    <p className="text-xs text-slate-500 mt-1">Experimente ampliar sua disponibilidade de horário ou remover filtros para ver outras oportunidades.</p>
                  </div>
                  {isAnyFilterActive && (
                    <button
                      type="button"
                      onClick={clearAllFilters}
                      className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-bold transition shadow-sm"
                    >
                      Ver todas as vagas disponíveis
                    </button>
                  )}
                </div>
              ) : (
                filteredJobs.map(job => {
                  const remun = formatRemuneration(job);
                  const total = job.totalSpots || 1;
                  const filled = job.filledSpots || 0;
                  const remaining = Math.max(0, total - filled);
                  const shiftBadge = getShiftBadge(job.startTime, job.endTime);
                  const shiftHours = calculateShiftHours(job.startTime, job.endTime);

                  return (
                    <div key={job.id} className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                      <div>
                        {/* Remuneration & Category Header */}
                        <div className="flex justify-between items-start mb-3 gap-2">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="px-2.5 py-1 bg-indigo-50 text-indigo-700 font-bold text-xs rounded-full">
                              {job.category}
                            </span>
                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${remun.badgeColor}`}>
                              {remun.label}
                            </span>
                          </div>

                          <div className="text-right">
                            <span className="text-2xl font-black text-emerald-600 block">{remun.display}</span>
                            {remun.subtitle && (
                              <span className="text-[11px] text-slate-500 font-medium block mt-0.5">{remun.subtitle}</span>
                            )}
                          </div>
                        </div>

                        <h3 className="font-bold text-slate-900 text-base mb-1">{job.title}</h3>
                        <p className="text-xs text-slate-500 mb-3">{job.companyName} • {job.address}</p>

                        <div className="bg-slate-50 p-3 rounded-2xl mb-4 text-xs text-slate-700 space-y-1.5 border border-slate-100">
                          <div className="flex items-center justify-between gap-1.5 font-semibold">
                            <div className="flex items-center gap-1.5">
                              <Icon name="calendar" className="w-3.5 h-3.5 text-slate-500" />
                              <span>{formatJobDate(job.date)} • {job.startTime} às {job.endTime}</span>
                            </div>
                            {shiftBadge && (
                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${shiftBadge.color}`}>
                                {shiftBadge.icon} {shiftBadge.label} ({shiftHours}h)
                              </span>
                            )}
                          </div>
                          {job.attire && (
                            <div className="text-[11px] text-slate-500">
                              👔 <strong>Traje:</strong> {job.attire}
                            </div>
                          )}
                          <div className="text-[11px] text-indigo-600 font-bold">
                            👥 {remaining} {remaining === 1 ? 'vaga restante' : 'vagas restantes'}
                          </div>
                        </div>
                      </div>

                      <button
                        type="button"
                        onClick={() => onWhatsappClick(job)}
                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl text-sm flex items-center justify-center gap-2 shadow-md transition transform active:scale-98"
                      >
                        <Icon name="whatsapp" className="w-5 h-5 text-white" />
                        <span>Chamar no Whats</span>
                      </button>
                    </div>
                  );
                })
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
