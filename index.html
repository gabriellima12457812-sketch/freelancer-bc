    // --- CPF VALIDATION & FORMATTING ---
    const formatCPF = (val) => {
      const clean = (val || '').replace(/\D/g, '').slice(0, 11);
      return clean
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    };

    const validateCPF = (cpf) => {
      if (!cpf) return false;
      const clean = cpf.replace(/\D/g, '');
      if (clean.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(clean)) return false;

      let sum = 0;
      for (let i = 0; i < 9; i++) sum += parseInt(clean.charAt(i)) * (10 - i);
      let rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      if (rev !== parseInt(clean.charAt(9))) return false;

      sum = 0;
      for (let i = 0; i < 10; i++) sum += parseInt(clean.charAt(i)) * (11 - i);
      rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      if (rev !== parseInt(clean.charAt(10))) return false;

      return true;
    };

    const formatCNPJ = (val) => {
      const clean = (val || '').replace(/\D/g, '').slice(0, 14);
      return clean
        .replace(/^(\d{2})(\d)/, '$1.$2')
        .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
        .replace(/\.(\d{3})(\d)/, '.$1/$2')
        .replace(/(\d{4})(\d)/, '$1-$2');
    };

    const validateCNPJ = (cnpj) => {
      if (!cnpj) return false;
      const clean = cnpj.replace(/\D/g, '');
      if (clean.length !== 14) return false;
      if (/^(\d)\1{13}$/.test(clean)) return false;

      let size = clean.length - 2;
      let numbers = clean.substring(0, size);
      const digits = clean.substring(size);
      let sum = 0;
      let pos = size - 7;
      for (let i = size; i >= 1; i--) {
        sum += parseInt(numbers.charAt(size - i)) * pos--;
        if (pos < 2) pos = 9;
      }
      let result = sum % 11 < 2 ? 0 : 11 - (sum % 11);
      if (result !== parseInt(digits.charAt(0))) return false;

      size = size + 1;
      numbers = clean.substring(0, size);
      sum = 0;
      pos = size - 7;
      for (let i = size; i >= 1; i--) {
        sum += parseInt(numbers.charAt(size - i)) * pos--;
        if (pos < 2) pos = 9;
      }
      result = sum % 11 < 2 ? 0 : 11 - (sum % 11);
      if (result !== parseInt(digits.charAt(1))) return false;

      return true;
    };

    const formatDoc = (val) => {
      const clean = (val || '').replace(/\D/g, '');
      if (clean.length <= 11) return formatCPF(clean);
      return formatCNPJ(clean);
    };

    const formatPhone = (val) => {
      const clean = (val || '').replace(/\D/g, '').slice(0, 11);
      if (clean.length <= 10) {
        return clean.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d)/, '$1-$2');
      }
      return clean.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
    };

    const formatMoney = (val) => {
      const num = Number(val) || 0;
      return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    // Calculate shift duration in hours (handles shifts crossing midnight, e.g. 18:00 to 02:00)
    const calculateShiftHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let startMinutes = sh * 60 + (sm || 0);
      let endMinutes = eh * 60 + (em || 0);
      if (endMinutes <= startMinutes) {
        endMinutes += 24 * 60; // Next day shift
      }
      return Number(((endMinutes - startMinutes) / 60).toFixed(1));
    };

    // Unified remuneration formatter supporting Diária, Por Hora, Só Comissão, and Fixo + Comissão
    const formatRemuneration = (job) => {
      if (!job) return { display: 'A combinar', label: 'A combinar', badgeColor: 'bg-slate-100 text-slate-700', type: 'diaria_fixa' };
      const type = job.paymentType || 'diaria_fixa';

      if (type === 'por_hora') {
        const hourly = Number(job.hourlyRate || job.rate || 0);
        const hours = calculateShiftHours(job.startTime, job.endTime);
        const estimatedTotal = hours > 0 ? (hourly * hours) : 0;
        return {
          type: 'por_hora',
          label: '⏱️ Por Hora',
          display: `${formatMoney(hourly)} / hora`,
          subtitle: hours > 0 ? `Turno de ~${hours}h (est. ${formatMoney(estimatedTotal)})` : null,
          badgeColor: 'bg-cyan-50 text-cyan-800 border border-cyan-200'
        };
      }

      if (type === 'so_comissao') {
        const com = job.commissionRate || 7;
        return {
          type: 'so_comissao',
          label: '📈 Só Comissão',
          display: `${com}% das vendas`,
          subtitle: job.commissionDetail ? job.commissionDetail : '100% comissionado s/ fixo',
          badgeColor: 'bg-purple-50 text-purple-800 border border-purple-200'
        };
      }

      if (type === 'fixo_mais_comissao') {
        const fix = Number(job.rate || 0);
        const com = job.commissionRate || 5;
        return {
          type: 'fixo_mais_comissao',
          label: '⚡ Fixo + Comissão',
          display: `${formatMoney(fix)} + ${com}% vendas`,
          subtitle: job.commissionDetail ? `${formatMoney(fix)} base + ${com}% (${job.commissionDetail})` : `Diária fixa + ${com}% sobre vendas`,
          badgeColor: 'bg-amber-50 text-amber-900 border border-amber-200'
        };
      }

      // Default: diaria_fixa
      const rate = Number(job.rate || 0);
      return {
        type: 'diaria_fixa',
        label: '💵 Diária Fixa',
        display: `${formatMoney(rate)} / diária`,
        subtitle: null,
        badgeColor: 'bg-emerald-50 text-emerald-800 border border-emerald-200'
      };
    };

    // --- HELPER FUNCTIONS FOR AVAILABILITY & FREE HOURS FILTERING ---
    const formatJobDate = (dateStr) => {
      if (!dateStr) return '';
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        const targetDate = new Date(y, m - 1, d);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const targetCheck = new Date(y, m - 1, d);
        targetCheck.setHours(0, 0, 0, 0);

        const diffDays = Math.round((targetCheck - today) / (1000 * 60 * 60 * 24));
        const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const dayName = daysOfWeek[targetDate.getDay()] || '';
        const pad = (n) => String(n).padStart(2, '0');
        const formattedBR = `${pad(d)}/${pad(m)}`;

        if (diffDays === 0) return `Hoje (${dayName}, ${formattedBR})`;
        if (diffDays === 1) return `Amanhã (${dayName}, ${formattedBR})`;
        return `${dayName}, ${formattedBR}`;
      } catch (e) {
        return dateStr;
      }
    };

    const checkDateMatch = (jobDate, filter, customDate) => {
      if (!filter || filter === 'todos') return true;
      if (!jobDate) return false;

      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

      const tmrw = new Date();
      tmrw.setDate(tmrw.getDate() + 1);
      const tomorrowStr = `${tmrw.getFullYear()}-${pad(tmrw.getMonth() + 1)}-${pad(tmrw.getDate())}`;

      if (filter === 'hoje') {
        return jobDate === todayStr;
      }
      if (filter === 'amanha') {
        return jobDate === tomorrowStr;
      }
      if (filter === 'fim_de_semana') {

      if ((!filter || filter === 'todos') && !freeStart && !freeEnd) return true;
      if (!jobStart || !jobEnd) return true;

      const parseMins = (t) => {
        if (!t) return 0;
        const [h, m] = t.split(':').map(Number);
        return h * 60 + (m || 0);
      };

      const js = parseMins(jobStart);
      let je = parseMins(jobEnd);
      if (je <= js) je += 1440; // Turno atravessa a meia-noite

      if (filter === 'noturno') {
        // Começa a partir das 17h ou termina após 22h
        return js >= 1020 || je > 1320;
      }

      if (filter === 'diurno') {
        // Turno durante o dia (começa a partir das 06h e termina até as 20h)
        return js >= 360 && js < 1020 && je <= 1200;
      }

      if (filter === 'madrugada') {

        return js >= 1320 || je > 1440;
      }

      // Horário livre personalizado definido pelo freelancer

          let adjustedJs = js;
          if (fs >= 720 && js < 720) adjustedJs += 1440;
          return adjustedJs >= fs;
        }

        if (!freeStart && freeEnd) {
          let fe = parseMins(freeEnd);
          if (fe < 720) fe += 1440;
          return je <= fe;
        }

        const fs = parseMins(freeStart);
        let fe = parseMins(freeEnd);
        if (fe <= fs) fe += 1440;

        let adjustedJs = js;
        let adjustedJe = je;
        if (fs >= 720 && js < 720) {

        }

        return adjustedJs >= fs && adjustedJe <= fe;
      }

              const past = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);
              return {
                ...u,
                trialExpiryDate: past.toISOString(),
                isSubscriptionActive: false,
                subscriptionPaidUntil: null
              };
            }
          }
          return u;
        }));
        showNotification('Estado do Trial alternado para testes!');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setAuthMode('login');
      };
      const [applyingJob, setApplyingJob] = useState(null);
      const [notifiedJobIds, setNotifiedJobIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem('fbc_notified_jobs') || '[]'); }
        catch (e) { return []; }
      });
      const [freelancerNotifs, setFreelancerNotifs] = useState(() => {
        try { return JSON.parse(localStorage.getItem('fbc_job_notifications') || '[]'); }
        catch (e) { return []; }
      });
      const [activeJobAlert, setActiveJobAlert] = useState(null);
      const [showNotifCenter, setShowNotifCenter] = useState(false);

      // EFEITO DE NOTIFICAÇÃO EM TEMPO REAL: Monitora quando surge uma nova vaga no perfil do freelancer
      useEffect(() => {
        if (!currentUser || currentUser.role !== 'freelancer' || !Array.isArray(jobs) || jobs.length === 0) return;

        const unnotifiedMatches = jobs.filter(job => {
          if (job.status !== 'ativa') return false;
          if (notifiedJobIds.includes(job.id)) return false;
          return isJobMatchingFreelancer(job, currentUser);
        });

        if (unnotifiedMatches.length > 0) {
          const newIds = unnotifiedMatches.map(j => j.id);
          const updatedIds = [...notifiedJobIds, ...newIds];
          setNotifiedJobIds(updatedIds);
          localStorage.setItem('fbc_notified_jobs', JSON.stringify(updatedIds.slice(-200)));

          unnotifiedMatches.forEach(job => {
            const remun = formatRemuneration(job);
            const title = `🔔 Nova Vaga para ${job.category}!`;
            const body = `${job.title} (${remun.display}) no ${job.companyName} em Balneário Camboriú. Toque para ver!`;

            sendSystemNotification(title, { body, tag: `job-${job.id}` });
            setActiveJobAlert(job);

            setFreelancerNotifs(prev => {
              const item = {
                id: `notif-${job.id}-${Date.now()}`,
                jobId: job.id,
                title: job.title,
                category: job.category,
                companyName: job.companyName,
                rateDisplay: remun.display,
                createdAt: new Date().toISOString(),
                read: false
              };
              const updated = [item, ...prev.filter(n => n.jobId !== job.id)].slice(0, 50);
              localStorage.setItem('fbc_job_notifications', JSON.stringify(updated));
              return updated;
            });
          });
        }
      }, [jobs, currentUser]);

      const handleUpdateAlertCategories = (newCategories) => {
        if (!currentUser) return;
        const updatedUser = { ...currentUser, alertCategories: newCategories };
        setCurrentUser(updatedUser);
        setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
        fetch(SYNC_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'save_user', user: updatedUser })
        }).catch(() => {});
        showNotification('Preferências de notificação salvas com sucesso!');
      };
      const [publicProfileId, setPublicProfileId] = useState(() => {
        if (typeof window !== 'undefined' && window.location.search) {
          try {
            const sp = new URLSearchParams(window.location.search);
            return sp.get('perfil') || sp.get('candidato') || null;
          } catch (e) { return null; }
        }
        return null;
      });

      const handleFreelancerWhatsappClick = (job) => {
        if (!currentUser) return;
        setApplyingJob(job);
      };

      const handleConfirmCandidatura = (job, profileData) => {
        if (!currentUser) return;
        const cleanPhone = (job.whatsapp || '').replace(/\D/g, '');
        const remun = formatRemuneration(job);

        // 1. Atualizar dados do freelancer local e na nuvem
        const updatedUser = {
          ...currentUser,
          age: profileData.age ? Number(profileData.age) : (currentUser.age || null),
          experienceTime: profileData.experienceTime || currentUser.experienceTime || '1 a 2 anos',
          city: profileData.city || currentUser.city || 'Balneário Camboriú',
          experience: profileData.experience !== undefined ? profileData.experience : (currentUser.experience || '')
        };

        setCurrentUser(updatedUser);
        setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));

        fetch(SYNC_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'save_user', user: updatedUser })
        }).catch(() => {});

        // 2. Link público com perfil verificado do candidato no Freelancer BC
        const baseUrl = (typeof window !== 'undefined' && window.location.origin && window.location.origin.includes('crm-piff-paff'))
          ? `${window.location.origin}/freelancer`
          : 'https://crm-piff-paff-v2.vercel.app/freelancer';
        const profileUrl = `${baseUrl}?perfil=${currentUser.id}`;

        // 3. Montar mensagem completa para a empresa no WhatsApp (SEM DOCUMENTOS / SEM CPF)
        const messageLines = [
          `Olá! Vi a vaga de *${job.title}* (${remun.display}) anunciada no app *Freelancer BC* e tenho total interesse!`,
          ``,
          `📋 *Meu Perfil de Freelancer:*`,
          `• *Nome:* ${currentUser.name}`,
          profileData.age ? `• *Idade:* ${profileData.age} anos` : null,
          `• *Função / Profissão:* ${currentUser.profession || 'Freelancer Especialista'}`,
          profileData.experienceTime ? `• *Tempo no Ramo:* ${profileData.experienceTime}` : null,
          profileData.city ? `• *Cidade / Região:* ${profileData.city}` : null,
          `• *WhatsApp:* ${formatPhone(currentUser.phone || '')}`,
          currentUser.email ? `• *E-mail:* ${currentUser.email}` : null,
          profileData.experience ? `• *Destaques / Resumo:* ${profileData.experience}` : null,
          ``,
          `🔗 *Acesse meu Perfil Completo no Freelancer BC:*`,
          `${profileUrl}`,
          ``,
          `Podemos combinar os detalhes da contratação? Aguardo seu retorno!`
        ].filter(line => line !== null).join('\n');

        const encodedText = encodeURIComponent(messageLines);

        // 4. Salvar candidatura na vaga (SEM DOCUMENTOS / SEM CPF)
        let modifiedJob = null;
        setJobs(prev => {
          const updated = prev.map(j => {
            if (j.id === job.id) {
              const existingApplicants = j.applicants || [];
              const alreadyApplied = existingApplicants.find(a => a.freelancerId === currentUser.id);

              const candidateRecord = {
                freelancerId: currentUser.id,
                name: currentUser.name,
                email: currentUser.email,
                phone: currentUser.phone,
                profession: currentUser.profession || 'Freelancer Especialista',
                age: profileData.age ? Number(profileData.age) : (currentUser.age || null),
                experienceTime: profileData.experienceTime || currentUser.experienceTime || '1 a 2 anos',
                city: profileData.city || currentUser.city || 'Balneário Camboriú',
                experience: profileData.experience || '',
                // Sem envio de documentos confidenciais (sem CPF/RG)
                clickedAt: new Date().toISOString(),
                hiredStatus: 'pendente'
              };

              let updatedApplicants;
              if (alreadyApplied) {
                updatedApplicants = existingApplicants.map(a =>
                  a.freelancerId === currentUser.id ? { ...a, ...candidateRecord } : a
                );
              } else {
                updatedApplicants = [candidateRecord, ...existingApplicants];
              }

              modifiedJob = {
                ...j,
                clicks: (j.clicks || 0) + (alreadyApplied ? 0 : 1),
                applicants: updatedApplicants
              };
              return modifiedJob;
            }
            return j;
          });
          localStorage.setItem('fbc_jobs', JSON.stringify(updated));
          broadcastUpdate('JOBS_UPDATED', { jobs: updated });
          return updated;
        });

        if (modifiedJob) {
          fetch(SYNC_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save_job', job: modifiedJob })
          }).then(() => syncWithCloud()).catch(() => {});
        }

        setApplyingJob(null);
        showNotification('Perfil enviado com sucesso! Abrindo WhatsApp...');
        window.open(`https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodedText}`, '_blank');
      };

      // --- SCREEN ROUTING ---
      if (!currentUser) {
        if (authMode === 'register') {
          return (
            <>
              {!isInstalled && !bannerDismissed && (
                <InstallAppBanner onInstall={handleTriggerInstall} onDismiss={() => setBannerDismissed(true)} />
              )}
              {publicProfileId && (
                <PublicCandidateProfileView
                  candidateId={publicProfileId}
                  users={users}
                  onClose={() => {
                    setPublicProfileId(null);
                    if (typeof window !== 'undefined' && window.history && window.history.replaceState) {
                      window.history.replaceState({}, document.title, window.location.pathname);
                    }
                  }}
                />
              )}
              <RegisterView
                users={users}
                onRegister={(newUser) => {
                  setUsers(prev => [...prev, newUser]);
                  setCurrentUser(newUser);
                  fetch(SYNC_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save_user', user: newUser })
                  }).then(() => syncWithCloud()).catch(() => {});
                  showNotification('Cadastro realizado com sucesso! Bem-vindo ao Freelancer BC!');
                }}
                onGoToLogin={() => setAuthMode('login')}
                onTriggerInstall={handleTriggerInstall}
              />
              {showInstallModal && <InstallAppModal onClose={() => setShowInstallModal(false)} />}
            </>
          );
        }
        return (
          <>
            {!isInstalled && !bannerDismissed && (
              <InstallAppBanner onInstall={handleTriggerInstall} onDismiss={() => setBannerDismissed(true)} />
            )}
            <LoginView
              users={users}
              onLogin={(user) => {
                setCurrentUser(user);
                syncWithCloud();
                showNotification(`Bem-vindo, ${user.name}!`);
              }}
              onGoToRegister={() => setAuthMode('register')}
              onTriggerInstall={handleTriggerInstall}
            />
            {showInstallModal && <InstallAppModal onClose={() => setShowInstallModal(false)} />}
          </>
        );
      }

      if (currentUser.status === 'pendente') {
        return (
          <PendingApprovalView
            user={currentUser}
            onLogout={handleLogout}
            onAdminSimulateApprove={() => handleApproveUser(currentUser.id)}
          />
        );
      }

      if (currentUser.status === 'rejeitado') {
        return <RejectedView user={currentUser} onLogout={handleLogout} />;
      }

      const trialInfo = checkTrialStatus(currentUser);

// Paywall desativado (plataforma sem custos)

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          {!isInstalled && !bannerDismissed && (
            <InstallAppBanner onInstall={handleTriggerInstall} onDismiss={() => setBannerDismissed(true)} />
          )}

          {currentUser.role === 'admin' && (
            <AdminDashboard
              admin={currentUser}
              users={users}
              jobs={jobs}
              invoices={invoices}
              mpConfig={mpConfig}
              onUpdateMpConfig={(updated) => {
                setMpConfig(updated);
                showNotification('Configurações salvas com sucesso!');
              }}
              onApprove={handleApproveUser}
              onReject={handleRejectUser}
              onToggleTrial={handleToggleTrialExpired}
              onAddTrialDays={handleAddTrialDays}
              onToggleStatus={handleToggleUserStatus}
              onDeleteUser={handleDeleteUser}
              onRefreshCloud={syncWithCloud}
              isSyncing={isSyncing}
              lastSyncTime={lastSyncTime}
              onLogout={handleLogout}
            />
          )}

          {currentUser.role === 'empresa' && (
            <EmpresaDashboard
              company={currentUser}
              jobs={jobs}
              invoices={invoices.filter(i => i.userId === currentUser.id)}
              onAddJob={(newJob) => {
                setJobs(prev => {
                  const updated = [newJob, ...prev.filter(j => j.id !== newJob.id)];
                  localStorage.setItem('fbc_jobs', JSON.stringify(updated));
                  broadcastUpdate('JOBS_UPDATED', { jobs: updated });
                  return updated;
                });
                fetch(SYNC_API_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ action: 'save_job', job: newJob })
                }).then(() => syncWithCloud()).catch(() => {});
                showNotification('Nova vaga publicada com sucesso!');
              }}
              onUpdateJob={(updatedJob) => {
                setJobs(prev => {
                  const updated = prev.map(j => j.id === updatedJob.id ? updatedJob : j);
                  localStorage.setItem('fbc_jobs', JSON.stringify(updated));
                  broadcastUpdate('JOBS_UPDATED', { jobs: updated });
                  return updated;
                });
                fetch(SYNC_API_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ action: 'save_job', job: updatedJob })
                }).then(() => syncWithCloud()).catch(() => {});
                showNotification('Vaga atualizada com sucesso!');
              }}
              onTogglePauseJob={(jobId) => {
                let toggledJob = null;
                setJobs(prev => {
                  const updated = prev.map(j => {
                    if (j.id === jobId) {
                      const next = j.status === 'pausada' ? 'ativa' : 'pausada';
                      showNotification(next === 'pausada' ? 'Vaga pausada.' : 'Vaga reativada!');
                      toggledJob = { ...j, status: next };
                      return toggledJob;
                    }
                    return j;
                  });
                  localStorage.setItem('fbc_jobs', JSON.stringify(updated));
                  broadcastUpdate('JOBS_UPDATED', { jobs: updated });
                  return updated;
                });
                if (toggledJob) {
                  fetch(SYNC_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save_job', job: toggledJob })
                  }).then(() => syncWithCloud()).catch(() => {});
                }
              }}
              onDeleteJob={(jobId) => {
                setJobs(prev => {
                  const updated = prev.filter(j => j.id !== jobId);
                  localStorage.setItem('fbc_jobs', JSON.stringify(updated));
                  broadcastUpdate('JOBS_UPDATED', { jobs: updated });
                  return updated;
                });
                fetch(SYNC_API_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ action: 'delete_job', jobId })
                }).then(() => syncWithCloud()).catch(() => {});
                showNotification('Vaga removida com sucesso.');
              }}
              onMarkSpotFilled={(jobId, isAppAttribution, candidateId = null) => {
                let modifiedJob = null;
                setJobs(prev => {
                  const updated = prev.map(j => {
                    if (j.id === jobId) {
                      const nextFilled = Math.min(j.totalSpots, (j.filledSpots || 0) + 1);
                      const isAllFilled = nextFilled >= j.totalSpots;

                      let updatedApplicants = j.applicants || [];
                      if (candidateId) {
                        updatedApplicants = updatedApplicants.map(a =>
                          a.freelancerId === candidateId
                            ? { ...a, hiredStatus: isAppAttribution ? 'contratado_app' : 'contratado_fora' }
                            : a
                        );
                      }

                      modifiedJob = {
                        ...j,
                        filledSpots: nextFilled,
                        status: isAllFilled ? 'encerrada' : j.status,
                        applicants: updatedApplicants
                      };
                      return modifiedJob;
                    }
                    return j;
                  });
                  localStorage.setItem('fbc_jobs', JSON.stringify(updated));
                  broadcastUpdate('JOBS_UPDATED', { jobs: updated });
                  return updated;
                });

                if (modifiedJob) {
                  fetch(SYNC_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save_job', job: modifiedJob })
                  }).then(() => syncWithCloud()).catch(() => {});
                }

                showNotification(
                  isAppAttribution
                    ? '🎉 Contratação pelo Freelancer BC registrada com sucesso!'
                    : 'Vaga marcada como preenchida (contratação externa).'
                );
              }}
              onOpenPaymentGateway={() => setShowPaymentGatewayModal(true)}
              onLogout={handleLogout}
              trialInfo={trialInfo}
              onTriggerInstall={handleTriggerInstall}
              linkedAccount={linkedAccount}
              onSwitchAccount={handleSwitchAccount}
              onOpenProfile={(cid) => setPublicProfileId(cid)}
            />
          )}

          {currentUser.role === 'freelancer' && (
            <FreelancerDashboard
              freelancer={currentUser}
              jobs={jobs.filter(j => j.status !== 'encerrada')}
              invoices={invoices.filter(i => i.userId === currentUser.id)}
              onWhatsappClick={handleFreelancerWhatsappClick}
              onOpenPaymentGateway={() => setShowPaymentGatewayModal(true)}
              onLogout={handleLogout}
              trialInfo={trialInfo}
              onTriggerInstall={handleTriggerInstall}
              linkedAccount={linkedAccount}
              onSwitchAccount={handleSwitchAccount}
              notifications={freelancerNotifs}
              onOpenNotifCenter={() => setShowNotifCenter(true)}
              activeJobAlert={activeJobAlert}
              onDismissJobAlert={() => setActiveJobAlert(null)}
            />
          )}

          {/* Modal de Instalação de App (A2HS) */}
          {showInstallModal && <InstallAppModal onClose={() => setShowInstallModal(false)} />}

          {/* Payment Gateway Modal (Used from Header, Paywall or Settings) */}
          {showPaymentGatewayModal && (
            <ModalGatewayPagamentoPix
              user={currentUser}
              mpConfig={mpConfig}
              onClose={() => setShowPaymentGatewayModal(false)}
              onPaymentConfirmed={handleBankPaymentConfirmed}
            />
          )}

                    {/* Central de Notificações para Freelancers */}
          {showNotifCenter && currentUser && currentUser.role === 'freelancer' && (
            <ModalCentralNotificacoes
              freelancer={currentUser}
              notifications={freelancerNotifs}
              jobs={jobs}
              onClose={() => setShowNotifCenter(false)}
              onSelectJob={(j) => {
                setShowNotifCenter(false);
                handleFreelancerWhatsappClick(j);
              }}
              onMarkAllRead={() => {
                const marked = freelancerNotifs.map(n => ({ ...n, read: true }));
                setFreelancerNotifs(marked);
                localStorage.setItem('fbc_job_notifications', JSON.stringify(marked));
              }}
              onUpdateCategories={handleUpdateAlertCategories}
              onTestNotification={() => {
                sendSystemNotification('🔔 Teste de Notificação Freelancer BC', {
                  body: 'O som e as notificações do seu aparelho estão funcionando 100%!'
                });
                showNotification('Som de notificação reproduzido!');
              }}
            />
          )}

          {/* Modal de Complemento de Candidatura com Perfil Completo */}
          {applyingJob && (
            <ModalComplementoCandidatura
              job={applyingJob}
              freelancer={currentUser}
              onClose={() => setApplyingJob(null)}
              onConfirm={(profileData) => handleConfirmCandidatura(applyingJob, profileData)}
            />
          )}

          {/* Modal / Card de Perfil Público Verificado do Candidato */}
          {publicProfileId && (
            <PublicCandidateProfileView
              candidateId={publicProfileId}
              users={users}
              onClose={() => {
                setPublicProfileId(null);
                if (typeof window !== 'undefined' && window.history && window.history.replaceState) {
                  window.history.replaceState({}, document.title, window.location.pathname);
                }
              }}
            />
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl text-sm font-medium transition-all transform animate-bounce ${
              toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'
            }`}>
              <Icon name={toast.type === 'error' ? 'xCircle' : 'checkCircle'} className="w-5 h-5 text-emerald-400" />
              <span>{toast.msg}</span>
            </div>
          )}
        </div>
      );
    }

    // Helper para geração oficial do padrão BR Code PIX (Banco Central do Brasil) com CRC16
    function generatePixBrCode(rawKey, rawName, rawCity, amount, txid = '***') {
      try {
        const isEmail = (rawKey || '').includes('@');
        const cleanKey = isEmail ? rawKey.trim() : (rawKey || '').replace(/[^a-zA-Z0-9]/g, '');
        const keyTag = `01${String(cleanKey.length).padStart(2, '0')}${cleanKey}`;
        const accountInfo = `0014BR.GOV.BCB.PIX${keyTag}`;
        const accountTag = `26${String(accountInfo.length).padStart(2, '0')}${accountInfo}`;
        const mccTag = '52040000';
        const currTag = '5303986';
        const amtStr = Number(amount || 0).toFixed(2);
        const amtTag = `54${String(amtStr.length).padStart(2, '0')}${amtStr}`;
        const countryTag = '5802BR';
        const cleanName = (rawName || 'RECEBEDOR').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9 ]/g, '').trim().slice(0, 25).toUpperCase();
        const nameTag = `59${String(cleanName.length).padStart(2, '0')}${cleanName}`;
        const cleanCity = (rawCity || 'BALNEARIO CAMBORIU').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9 ]/g, '').trim().slice(0, 15).toUpperCase();
        const cityTag = `60${String(cleanCity.length).padStart(2, '0')}${cleanCity}`;
        const cleanTxid = (txid || '***').replace(/[^a-zA-Z0-9]/g, '').slice(0, 25) || '***';
        const addField = `05${String(cleanTxid.length).padStart(2, '0')}${cleanTxid}`;
        const addTag = `62${String(addField.length).padStart(2, '0')}${addField}`;
        
        const payloadWithoutCrc = `000201${accountTag}${mccTag}${currTag}${amtTag}${countryTag}${nameTag}${cityTag}${addTag}6304`;
        
        let crc = 0xFFFF;
        for (let i = 0; i < payloadWithoutCrc.length; i++) {
          crc ^= (payloadWithoutCrc.charCodeAt(i) << 8);
          for (let j = 0; j < 8; j++) {
            if ((crc & 0x8000) !== 0) {
              crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
            } else {
              crc = (crc << 1) & 0xFFFF;
            }
          }
        }
        const crcHex = (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        return payloadWithoutCrc + crcHex;
      } catch (e) {
        return `00020126360014BR.GOV.BCB.PIX011464435385000100520400005303986540${Number(amount || 0).toFixed(2)}5802BR5925GABRIEL WILLIAN LIMA6015BALNEARIO CAMBO62070503***6304A1B2`;
      }
    }

    // ==========================================
    // MODAL GATEWAY DE PAGAMENTO PIX (INFINITEPAY / PAGBANK / MERCADO PAGO)
    // ==========================================
    function ModalGatewayPagamentoPix({ user, mpConfig, onClose, onPaymentConfirmed }) {
      const activeGateway = mpConfig?.activeGateway || 'infinitepay';
      const currentGw = GATEWAY_INFO[activeGateway] || GATEWAY_INFO.infinitepay;
      const isFreelancer = user.role === 'freelancer';
      const price = isFreelancer ? (Number(mpConfig?.freelancerPrice) || 9.90) : (Number(mpConfig?.companyPrice) || 29.90);
      const receiverName = mpConfig?.receiverName || '64.435.385 GABRIEL WILLIAN LIMA';
      const pixKey = mpConfig?.pixKey || '64.435.385/0001-00';
      const isSandbox = mpConfig?.environment === 'sandbox';

      // STAGES: 'awaiting_payment' | 'simulating_bank' | 'confirmed'
      const [stage, setStage] = useState('awaiting_payment');
      const [copied, setCopied] = useState(false);
      const [linkCopied, setLinkCopied] = useState(false);
      const [confirmedReceipt, setConfirmedReceipt] = useState(null);

      // Temporary Invoice Object
      const [currentInvoice] = useState(() => {
        const invId = `PIX-${activeGateway.slice(0, 3).toUpperCase()}-${Math.floor(100000 + Math.random() * 900000)}`;
        return {
          id: invId,
          userId: user.id,
          userName: user.name,
          userRole: user.role,
          amount: price,
          status: 'pendente',
          gateway: activeGateway,
          gatewayName: currentGw.name,
          pixKey: generatePixBrCode(pixKey, receiverName, 'BALNEARIO CAMBORIU', price, invId),
          createdAt: new Date().toISOString()
        };
      });

      const officialPaymentUrl = `https://pagamento.freelancerbc.com.br/fatura/${currentInvoice.id}`;

      const handleCopyPix = () => {
        navigator.clipboard?.writeText(currentInvoice.pixKey);
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
      };

    // ==========================================
    // LOGIN & REGISTER
    // ==========================================
    function LoginView({ users, onLogin, onGoToRegister, onTriggerInstall }) {
      const [selectedRole, setSelectedRole] = useState('freelancer'); // 'freelancer' | 'empresa'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState('');
      const [suggestedAccount, setSuggestedAccount] = useState(null);
      const [multiAccounts, setMultiAccounts] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        setSuggestedAccount(null);
        if (!email.trim() || !password.trim()) {
          setError('Preencha seu usuário/e-mail/WhatsApp e sua senha.');
          return;
        }

        const loginTerm = email.trim().toLowerCase();
        const cleanLoginPhone = email.replace(/\D/g, '');

        // 1. Acesso Administrador BC
        if ((loginTerm === 'admin' || email.trim() === 'admin') && password === '08520852') {
          const adminUser = users.find(u => u.role === 'admin') || {
            id: 'u-admin',
            name: 'Administrador',
            username: 'admin',
            role: 'admin',
            status: 'aprovado'
          };
          onLogin(adminUser);
          return;
        }

        const isUserMatch = (u) => {
          const emailMatch = u.email && u.email.toLowerCase() === loginTerm;
          const userMatch = u.username && u.username.toLowerCase() === loginTerm;
          const phoneMatch = cleanLoginPhone.length >= 8 && u.phone && u.phone.replace(/\D/g, '').includes(cleanLoginPhone);
          return (emailMatch || userMatch || phoneMatch);
        };

        // 2. Procurar contas no PERFIL SELECIONADO (Freelancer ou Empresa)
        const matchingCurrentRole = users.filter(u => 
          u.role === selectedRole && 
          isUserMatch(u) && 
          u.password === password
        );

        if (matchingCurrentRole.length === 1) {
          onLogin(matchingCurrentRole[0]);
          return;
        }

        if (matchingCurrentRole.length > 1) {
          setMultiAccounts(matchingCurrentRole);
          return;
        }

        // 3. Usuário tem conta no OUTRO perfil com essa senha? (Ex: cadastrado como Empresa mas tentou Freelancer)
        const otherRole = selectedRole === 'freelancer' ? 'empresa' : 'freelancer';
        const matchingOtherRole = users.filter(u => 
          u.role === otherRole && 
          isUserMatch(u) && 
          u.password === password
        );

        if (matchingOtherRole.length > 0) {
          const targetRoleName = otherRole === 'empresa' ? 'Empresa' : 'Freelancer';
          setSuggestedAccount(matchingOtherRole[0]);
          setError(`Localizamos sua conta no perfil ${targetRoleName}! Clique no botão abaixo para entrar como ${targetRoleName}.`);
          return;
        }

        // 4. Usuário existe na categoria selecionada, porém com senha incorreta
        const userExistsInRole = users.some(u => u.role === selectedRole && isUserMatch(u));
        if (userExistsInRole) {
          setError('Senha incorreta para este perfil.');
          return;
        }

        // 5. Usuário existe na OUTRA categoria
        const userExistsInOther = users.some(u => u.role === otherRole && isUserMatch(u));
        if (userExistsInOther) {
          const otherName = otherRole === 'empresa' ? 'Empresa' : 'Freelancer';
          setError(`Sua conta está cadastrada como perfil ${otherName}. Selecione a aba "${otherName === 'Empresa' ? '🏢 Sou Empresa' : '💼 Sou Freelancer'}" acima para entrar.`);
          return;
        }

        setError('Nenhum cadastro encontrado com esses dados para este perfil.');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
          {/* Top Mobile PWA Install button */}
          <div className="absolute top-3 right-3 z-20">
            <button
              type="button"
              onClick={onTriggerInstall}
              className="px-3 py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg backdrop-blur-sm border border-indigo-400/30 transition active:scale-95"
            >
              <Icon name="smartphone" className="w-3.5 h-3.5" />
              <span>Virar App</span>
            </button>
          </div>

          <div className="sm:mx-auto sm:w-full sm:max-w-md text-center z-10">
            <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-emerald-400 shadow-xl shadow-indigo-500/20 mb-4">
              <Icon name="briefcase" className="w-8 h-8 text-white" />
            </div>
            <h2 className="text-3xl font-extrabold tracking-tight text-white">
              Freelancer <span className="bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">BC</span>
            </h2>
            <p className="mt-2 text-sm text-slate-400">
              O ecossistema para eventos, bares e freelancers em Balneário Camboriú
            </p>
          </div>

          <div className="mt-8 sm:mx-auto sm:w-full sm:max-w-md z-10">
            <div className="bg-slate-900/80 backdrop-blur-xl py-8 px-6 sm:px-10 shadow-2xl rounded-3xl border border-slate-800">
              {multiAccounts ? (
                <div>
                  <div className="text-center mb-6">
                    <div className="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
                      <Icon name="users" className="w-6 h-6" />
                    </div>
                    <h3 className="text-lg font-bold text-white">Escolha o Perfil de Acesso</h3>
                    <p className="text-xs text-slate-400 mt-1">Identificamos mais de um cadastro vinculado. Como deseja entrar?</p>
                  </div>

                  <div className="space-y-3">
                    {multiAccounts.map(account => (
                      <button
                        key={account.id}
                        type="button"
                        onClick={() => onLogin(account)}
                        className="w-full p-4 bg-slate-950/80 hover:bg-slate-800/80 border border-slate-800 hover:border-indigo-500 rounded-2xl flex items-center justify-between text-left transition group"
                      >
                        <div className="flex items-center gap-3.5">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                            account.role === 'empresa' ? 'bg-indigo-600/20 text-indigo-400' : 'bg-emerald-600/20 text-emerald-400'
                          }`}>
                            <Icon name={account.role === 'empresa' ? 'building' : 'briefcase'} className="w-5 h-5" />
                          </div>
                          <div>
                            <div className="font-bold text-sm text-white group-hover:text-indigo-300 transition">
                              {account.name}
                            </div>
                            <div className="text-xs text-slate-400">
                              {account.role === 'empresa' ? `Empresa • ${account.businessType || 'Contratante'}` : `Freelancer • ${account.profession || 'Profissional'}`}
                            </div>
                          </div>
                        </div>
                        <span className="text-xs font-bold text-indigo-400 flex items-center gap-1 group-hover:translate-x-1 transition">
                          Entrar →
                        </span>
                      </button>
                    ))}

                    <button
                      type="button"
                      onClick={() => setMultiAccounts(null)}
                      className="w-full py-2.5 text-xs text-slate-400 hover:text-white transition text-center"
                    >
                      ← Voltar ao login
                    </button>
                  </div>
                </div>
              ) : (
                <>
                  {/* SELETOR DE PERFIL: FREELANCER OU EMPRESA */}
                  <div className="grid grid-cols-2 p-1.5 bg-slate-950 rounded-2xl border border-slate-800 mb-6">
                    <button
                      type="button"
                      onClick={() => { setSelectedRole('freelancer'); setError(''); setSuggestedAccount(null); }}
                      className={`py-3 px-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition active:scale-95 ${
                        selectedRole === 'freelancer'
                          ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-500/20 font-black ring-1 ring-emerald-400/30'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800/40'
                      }`}
                    >
                      <Icon name="briefcase" className="w-4 h-4" />
                      <span>💼 Sou Freelancer</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => { setSelectedRole('empresa'); setError(''); setSuggestedAccount(null); }}
                      className={`py-3 px-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition active:scale-95 ${
                        selectedRole === 'empresa'
                          ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/20 font-black ring-1 ring-indigo-400/30'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800/40'
                      }`}
                    >
                      <Icon name="building" className="w-4 h-4" />
                      <span>🏢 Sou Empresa</span>
                    </button>
                  </div>

                  {error && (
                    <div className="mb-4 p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-start gap-3 text-rose-300 text-xs sm:text-sm">
                      <Icon name="alertCircle" className="w-5 h-5 flex-shrink-0 mt-0.5" />
                      <div>{error}</div>
                    </div>
                  )}

                  {suggestedAccount && (
                    <div className="mb-5 p-3.5 bg-indigo-500/15 border border-indigo-500/40 rounded-xl flex items-center justify-between gap-3">
                      <div className="text-xs text-indigo-200">
                        Entrar com perfil <strong className="text-white">{suggestedAccount.name}</strong> ({suggestedAccount.role === 'empresa' ? 'Empresa' : 'Freelancer'})?
                      </div>
                      <button
                        type="button"
                        onClick={() => onLogin(suggestedAccount)}
                        className="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg shrink-0 shadow transition active:scale-95"
                      >
                        Entrar Agora →
                      </button>
                    </div>
                  )}

                  <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        {selectedRole === 'freelancer' ? 'E-mail, Usuário ou WhatsApp' : 'E-mail ou WhatsApp da Empresa'}
                      </label>
                      <input
                        type="text"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder={selectedRole === 'freelancer' ? "Digite seu e-mail ou WhatsApp" : "Digite o e-mail da empresa ou WhatsApp"}
                        className="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Senha</label>
                      <div className="relative">
                        <input
                          type={showPassword ? "text" : "password"}
                          required
                          value={password}
                          onChange={(e) => setPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm pr-10 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-3 text-slate-400 hover:text-white">
                          <Icon name={showPassword ? "eyeOff" : "eye"} className="w-5 h-5" />
                        </button>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className={`w-full py-3.5 px-4 text-white font-black rounded-xl text-sm shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2 ${
                        selectedRole === 'freelancer'
                          ? 'bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-emerald-500/25'
                          : 'bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 shadow-indigo-500/25'
                      }`}
                    >
                      <Icon name={selectedRole === 'freelancer' ? 'briefcase' : 'building'} className="w-4 h-4" />
                      <span>Entrar como {selectedRole === 'freelancer' ? 'Freelancer' : 'Empresa'}</span>
                    </button>
                  </form>

                  <div className="mt-6 pt-5 border-t border-slate-800 text-center">
                    <p className="text-sm text-slate-400">
                      Não tem conta? <button onClick={onGoToRegister} className="text-emerald-400 font-bold hover:underline">Cadastre-se grátis</button>
                    </p>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function RegisterView({ users, onRegister, onGoToLogin, onTriggerInstall }) {
      const [userType, setUserType] = useState('freelancer');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [phone, setPhone] = useState('');
      const [cpf, setCpf] = useState('');
      const [cnpj, setCnpj] = useState('');
      const [businessType, setBusinessType] = useState('Bar / Balada');
      const [profession, setProfession] = useState('Garçom');
      const [age, setAge] = useState('');
      const [experienceTime, setExperienceTime] = useState('1 a 2 anos');
      const [city, setCity] = useState('Balneário Camboriú');
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        if (!name.trim() || !email.trim() || !password.trim() || !phone.trim()) {
          setError('Preencha os campos obrigatórios.');
          return;
        }

        // Regra de unicidade de e-mail por categoria/papel
        if (users.some(u => u.role === userType && u.email && u.email.toLowerCase() === email.trim().toLowerCase())) {
          setError(`Já existe um cadastro de ${userType === 'freelancer' ? 'Freelancer' : 'Empresa'} com este e-mail.`);
          return;
        }

        let formattedDoc = null;
        let cleanDoc = '';

        if (userType === 'freelancer') {
          cleanDoc = (cpf || '').replace(/\D/g, '');
          if (!cleanDoc) {
            setError('CPF é obrigatório para cadastro de Freelancer.');
            return;
          }
          if (!validateCPF(cpf)) {
            setError('CPF inválido. Verifique os números informados.');
            return;
          }
          // Regra: Apenas 1 cadastro de Freelancer por CPF
          const docExists = users.some(u => 
            u.role === 'freelancer' && 
            (u.cpf || '').replace(/\D/g, '') === cleanDoc
          );
          if (docExists) {
            setError('Este CPF já possui uma conta de Freelancer. Regra: Apenas 1 cadastro por CPF.');
            return;
          }
          formattedDoc = formatCPF(cpf);
        } else {
          // userType === 'empresa'
          cleanDoc = (cnpj || '').replace(/\D/g, '');
          if (!cleanDoc) {
            setError('CNPJ ou CPF é obrigatório para cadastro da Empresa.');
            return;
          }
          if (cleanDoc.length === 11) {
            if (!validateCPF(cleanDoc)) {
              setError('CPF da Empresa inválido.');
              return;
            }
            formattedDoc = formatCPF(cleanDoc);
          } else if (cleanDoc.length === 14) {
            if (!validateCNPJ(cleanDoc)) {
              setError('CNPJ inválido. Verifique os números informados.');
              return;
            }
            formattedDoc = formatCNPJ(cleanDoc);
          } else {
            setError('Documento inválido. Digite um CPF (11 dígitos) ou CNPJ (14 dígitos) válido.');
            return;
          }

          // Regra: Apenas 1 cadastro de Empresa por CNPJ/CPF
          const docExists = users.some(u => 
            u.role === 'empresa' && 
            ((u.cnpj || u.cpf || '').replace(/\D/g, '') === cleanDoc)
          );
          if (docExists) {
            setError('Este CNPJ/CPF já possui uma conta de Empresa. Regra: Apenas 1 cadastro por documento.');
            return;
          }
        }

        // Aprovação automática com acesso 100% gratuito e ilimitado
        const now = new Date();

        onRegister({
          id: `u-${Date.now()}`,
          name: name.trim(),
          email: email.trim().toLowerCase(),
          password,
          role: userType,
          status: 'aprovado', // Aprovação direta sem bloqueio
          cpf: userType === 'freelancer' ? formattedDoc : (cleanDoc.length === 11 ? formattedDoc : null),
          cnpj: userType === 'empresa' && cleanDoc.length === 14 ? formattedDoc : null,
          phone: phone.replace(/\D/g, ''),
          businessType: userType === 'empresa' ? businessType : null,
          profession: userType === 'freelancer' ? profession : null,
          age: userType === 'freelancer' && age ? Number(age) : null,
          experienceTime: userType === 'freelancer' ? experienceTime : null,
          city: userType === 'freelancer' ? city : null,
          createdAt: now.toISOString(),
          trialStartDate: now.toISOString(),
          trialExpiryDate: null,
          isSubscriptionActive: true,
        });
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center py-10 px-4 sm:px-6 relative">
          {/* Top Mobile PWA Install button */}
          <div className="absolute top-3 right-3 z-20">
            <button
              type="button"
              onClick={onTriggerInstall}
              className="px-3 py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg backdrop-blur-sm border border-indigo-400/30 transition active:scale-95"
            >
              <Icon name="smartphone" className="w-3.5 h-3.5" />
              <span>Virar App</span>
            </button>
          </div>

          <div className="max-w-xl mx-auto w-full bg-slate-900/90 border border-slate-800 p-8 rounded-3xl shadow-2xl">
            <h2 className="text-2xl font-black text-white text-center mb-1">Cadastre-se no Freelancer BC</h2>
            <p className="text-xs text-slate-400 text-center mb-5">Acesso gratuito e imediato à rede oficial do Freelancer BC</p>
            
            <div className="grid grid-cols-2 gap-3 mb-6 p-1 bg-slate-950 rounded-xl">
              <button
                type="button"
                onClick={() => setUserType('freelancer')}
                className={`py-2.5 rounded-lg text-xs font-bold transition ${userType === 'freelancer' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                Sou Freelancer
              </button>
              <button
                type="button"
                onClick={() => setUserType('empresa')}
                className={`py-2.5 rounded-lg text-xs font-bold transition ${userType === 'empresa' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                Sou Empresa
              </button>
            </div>

            {error && <div className="mb-4 p-3 bg-rose-500/10 text-rose-300 text-xs rounded-xl border border-rose-500/30">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Nome {userType === 'empresa' ? 'do Estabelecimento / Empresa' : 'Completo'} *</label>
                <input required value={name} onChange={e => setName(e.target.value)} placeholder={userType === 'empresa' ? 'Ex: Restaurante & Lounge BC' : 'Ex: Gabriel Lima'} className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">E-mail {userType === 'empresa' ? 'Comercial' : ''} *</label>
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="email@exemplo.com" className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">WhatsApp *</label>
                  <input required value={formatPhone(phone)} onChange={e => setPhone(e.target.value)} placeholder="(47) 99999-9999" className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
              </div>

              {userType === 'freelancer' ? (
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">CPF (Obrigatório - 1 conta por CPF) *</label>
                    <input
                      required
                      value={formatCPF(cpf)}
                      onChange={e => setCpf(e.target.value)}
                      maxLength={14}
                      placeholder="000.000.000-00"
                      className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm font-mono text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <span className="text-[11px] text-slate-400 mt-1 block">Cada pessoa pode ter 1 conta de Freelancer por CPF (e também uma conta de Empresa).</span>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Profissão Principal</label>
                    <select value={profession} onChange={e => setProfession(e.target.value)} className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                      <option value="Garçom">Garçom</option>
                      <option value="Bartender & Mixologista">Bartender & Mixologista</option>
                      <option value="Cozinheiro">Cozinheiro</option>
                      <option value="Auxiliar de Cozinha">Auxiliar de Cozinha</option>
                      <option value="Recepção">Recepção / Hostess</option>
                      <option value="Segurança">Segurança</option>
                      <option value="Limpeza">Limpeza & Apoio</option>
                      <option value="Promoter de Vendas">Promoter de Vendas</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Sua Idade (anos)</label>
                      <input
                        type="number"
                        min="16"
                        max="99"
                        value={age}
                        onChange={e => setAge(e.target.value)}
                        placeholder="Ex: 24"
                        className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Cidade / Região</label>
                      <input
                        value={city}
                        onChange={e => setCity(e.target.value)}
                        placeholder="Ex: Balneário Camboriú"
                        className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Tempo de Atuação na Área</label>
                    <select
                      value={experienceTime}
                      onChange={e => setExperienceTime(e.target.value)}
                      className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="Menos de 1 ano (Iniciante)">Menos de 1 ano (Iniciante)</option>
                      <option value="1 a 2 anos">1 a 2 anos de experiência</option>
                      <option value="3 a 5 anos">3 a 5 anos de experiência</option>
                      <option value="Mais de 5 anos (Sênior / Especialista)">Mais de 5 anos (Sênior / Especialista)</option>
                    </select>
                  </div>
                </div>
              ) : (
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">CNPJ ou CPF da Empresa (1 conta por documento) *</label>
                    <input
                      required
                      value={formatDoc(cnpj)}
                      onChange={e => setCnpj(e.target.value)}
                      maxLength={18}
                      placeholder="00.000.000/0001-00 ou 000.000.000-00"
                      className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm font-mono text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <span className="text-[11px] text-slate-400 mt-1 block">Aceita CNPJ ou CPF (MEI/Autônomo). Limite: 1 conta de Empresa por documento.</span>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Segmento</label>
                    <select value={businessType} onChange={e => setBusinessType(e.target.value)} className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                      <option value="Bar / Balada">Bar / Balada</option>
                      <option value="Restaurante">Restaurante / Gastronomia</option>
                      <option value="Eventos">Produtora de Eventos</option>
                      <option value="Hotelaria">Hotelaria / Beach Club</option>
                      <option value="Outro">Outro Estabelecimento</option>
                    </select>
                  </div>
                </div>
              )}

              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Senha *</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>

              <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-300 text-xs flex items-center gap-2">
                <Icon name="checkCircle" className="w-4 h-4 flex-shrink-0 text-emerald-400" />
                <span><strong>Acesso Imediato:</strong> Crie sua conta e comece a usar a plataforma agora mesmo!</span>
              </div>

              <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                <Icon name="zap" className="w-4 h-4" />
                <span>Criar Conta Gratuita</span>
              </button>
            </form>

            <div className="mt-4 text-center">
              <button onClick={onGoToLogin} className="text-xs text-slate-400">Já tem conta? <span className="text-indigo-400 hover:underline">Fazer Login</span></button>
            </div>
          </div>
        </div>
      );
    }

    function PendingApprovalView({ user, onLogout }) {
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center py-12 px-4">
          <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
            <div className="w-16 h-16 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto mb-4">
              <Icon name="clock" className="w-8 h-8 animate-spin" />
            </div>
            <h2 className="text-2xl font-bold text-white mb-2">Conta em Análise</h2>
            <p className="text-sm text-slate-400 mb-6">
              Olá, <strong>{user.name}</strong>! Seus dados estão em análise de moderação pela administração da plataforma.

    function AdminDashboard({ admin, users, jobs, invoices, mpConfig, onUpdateMpConfig, onApprove, onReject, onToggleTrial, onAddTrialDays, onToggleStatus, onDeleteUser, onRefreshCloud, isSyncing, lastSyncTime, onLogout }) {

      const [userTypeFilter, setUserTypeFilter] = useState('todos'); // 'todos' | 'freelancer' | 'empresa'
      const [userStatusFilter, setUserStatusFilter] = useState('todos'); // 'todos' | 'aprovado' | 'pendente' | 'bloqueado'
      const [userSearch, setUserSearch] = useState('');
      const [viewMode, setViewMode] = useState('cards'); // 'cards' | 'table'
      const [selectedUserForModal, setSelectedUserForModal] = useState(null);

      const nonAdminUsers = useMemo(() => users.filter(u => u.role !== 'admin'), [users]);
      const freelancers = useMemo(() => nonAdminUsers.filter(u => u.role === 'freelancer'), [nonAdminUsers]);
      const companies = useMemo(() => nonAdminUsers.filter(u => u.role === 'empresa'), [nonAdminUsers]);
      const pendingUsers = useMemo(() => users.filter(u => u.status === 'pendente'), [users]);
      
      const totalPaidRevenue = useMemo(() => {
        return invoices.filter(i => i.status === 'pago').reduce((acc, curr) => acc + curr.amount, 0);
      }, [invoices]);

      const filteredUsers = useMemo(() => {
        return nonAdminUsers.filter(u => {
          if (userTypeFilter !== 'todos' && u.role !== userTypeFilter) return false;
          if (userStatusFilter !== 'todos' && u.status !== userStatusFilter) return false;
          if (userSearch.trim()) {
            const q = userSearch.toLowerCase();
            const matchName = (u.name || '').toLowerCase().includes(q);
            const matchEmail = (u.email || '').toLowerCase().includes(q);
            const matchPhone = (u.phone || '').includes(q);
            const matchCpf = (u.cpf || '').includes(q);
            const matchCnpj = (u.cnpj || '').includes(q);
            const matchProf = (u.profession || '').toLowerCase().includes(q);
            const matchBiz = (u.businessType || '').toLowerCase().includes(q);
            return matchName || matchEmail || matchPhone || matchCpf || matchCnpj || matchProf || matchBiz;
          }
          return true;
        });
      }, [nonAdminUsers, userTypeFilter, userStatusFilter, userSearch]);

      // Estado do formulário de Gateways (InfinitePay / PagBank / Mercado Pago)

        enabled: mpConfig?.enabled ?? true,

        pixKey: mpConfig?.pixKey || 'financeiro@freelancerbc.com.br',
        freelancerPrice: mpConfig?.freelancerPrice ?? 9.90,
        companyPrice: mpConfig?.companyPrice ?? 29.90,

        // InfinitePay (CloudWalk)
        infinitepayApiKey: mpConfig?.infinitepayApiKey || 'inf_live_98127391823719827391',
        infinitepayWallet: mpConfig?.infinitepayWallet || 'wallet_bc_78912',
        infinitepayWebhook: mpConfig?.infinitepayWebhook || 'https://api.freelancerbc.com.br/v1/webhooks/infinitepay',

        // PagBank (Banco 290)
        pagbankToken: mpConfig?.pagbankToken || 'PAGBANK_TOKEN_89712983719283719283',
        pagbankPublicKey: mpConfig?.pagbankPublicKey || 'PAGBANK_PUB_KEY_78129371',
        pagbankWebhook: mpConfig?.pagbankWebhook || 'https://api.freelancerbc.com.br/v1/webhooks/pagbank',

        // Mercado Pago (Banco 323)
        accessToken: mpConfig?.accessToken || 'APP_USR-7824109283748291-092116-4b8c91a029384756bfcd918237465901-198273645',
        publicKey: mpConfig?.publicKey || 'APP_USR-8a7b6c5d-4e3f-2a1b-0c9d-8e7f6a5b4c3d',
        webhookSecret: mpConfig?.webhookSecret || '98a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0',
        webhookUrl: mpConfig?.webhookUrl || 'https://api.freelancerbc.com.br/v1/webhooks/mercadopago'
      }));

      const [showToken, setShowToken] = useState(false);
      const [webhookCopied, setWebhookCopied] = useState(false);
      const [isTestingMp, setIsTestingMp] = useState(false);
      const [mpTestResult, setMpTestResult] = useState(null);

        ? gwForm.infinitepayWebhook
